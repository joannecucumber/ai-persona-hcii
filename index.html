<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Static Snapshot to Living System｜HCII</title>
<style>
  :root{
    --bg1:#232323; --bg2:#2b2b2b; --ink:#f1f3f2; --muted:#9aa39d;
    --accent:#0FC77B; --accent2:#4fe0a6; --warn:#fbbf24; --bad:#fb7185;
    --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.12);
    --grid:rgba(15,199,123,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,"PingFang TC","Noto Sans TC",sans-serif;
    background-color:var(--bg1);
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px),
      radial-gradient(1000px 700px at 75% -12%,rgba(15,199,123,.10),transparent 60%);
    background-size:48px 48px,48px 48px,100% 100%;
    background-repeat:repeat,repeat,no-repeat;
    color:var(--ink); overflow:hidden;
  }
  .deck{position:fixed;inset:0;transition:right .3s}
  body.notes-open .deck{right:36%}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:6vh 8vw;opacity:0;transition:opacity .35s ease}
  .slide.active{display:flex;opacity:1}
  .slide.canva{padding:0;flex-direction:row;align-items:center;justify-content:center;background:#000}
  .slide.canva img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
  /* mock slide (inline HTML, scales to fit) */
  .slide.mock-slide{padding:0;overflow:hidden;background:#0a0e0b;background-image:
    linear-gradient(rgba(15,199,123,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,199,123,.03) 1px,transparent 1px),
    radial-gradient(800px 600px at 20% 0%,rgba(15,199,123,.08),transparent 60%);
    background-size:64px 64px,64px 64px,100% 100%;background-repeat:repeat,repeat,no-repeat}
  .slide.mock-slide::after{content:'';position:absolute;bottom:0;left:0;right:0;height:18px;background:#0FC77B;z-index:2}
  .mk{width:1920px;height:1080px;padding:90px 110px 110px;color:#f1f3f2;font-family:'Inter','PingFang TC',-apple-system,sans-serif;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box;display:flex;flex-direction:column}
  .mk *{box-sizing:border-box}
  .mk-kicker{color:#0FC77B;font-weight:700;letter-spacing:.18em;font-size:22px;text-transform:uppercase;margin-bottom:24px}
  .mk-h1{font-size:46px;line-height:1.18;font-weight:700;letter-spacing:-.01em;margin:0 0 38px 0;max-width:1500px}
  .mk-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
  .mk-row2{display:grid;grid-template-columns:1.2fr 1fr;gap:30px}
  .mk-card{background:rgba(255,255,255,.04);border:1.6px solid rgba(15,199,123,.22);border-radius:16px;padding:26px 26px}
  .mk-card-lbl{color:#0FC77B;font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
  .mk-card-big{color:#fff;font-weight:800;font-size:32px;line-height:1.15;margin-bottom:10px}
  .mk-card-big small{display:block;color:#aab3ac;font-size:15px;font-weight:500;margin-top:6px}
  .mk-card-sub{color:#aab3ac;font-size:16px;line-height:1.5}
  .mk-card-sub b{color:#0FC77B;font-weight:600}
  .mk-card-list{margin:8px 0 0;padding:0;list-style:none}
  .mk-card-list li{color:#cbd5cc;font-size:16px;line-height:1.5;padding:5px 0;display:flex;gap:10px}
  .mk-card-list li::before{content:'';width:6px;height:6px;background:#0FC77B;border-radius:50%;flex-shrink:0;margin-top:9px}
  .mk-flow{display:flex;align-items:center;gap:22px;margin:38px 0}
  .mk-node{flex:1;background:rgba(255,255,255,.04);border:1.8px solid rgba(15,199,123,.3);border-radius:18px;padding:28px 26px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center}
  .mk-node-step{color:#0FC77B;font-weight:800;font-size:17px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
  .mk-node-ttl{color:#fff;font-size:24px;font-weight:700;margin-bottom:12px;line-height:1.2}
  .mk-node-sub{color:#aab3ac;font-size:16px;line-height:1.5}
  .mk-arr{color:#0FC77B;font-size:40px;font-weight:300;flex-shrink:0}
  .mk-rq{display:flex;gap:32px;margin-top:20px;justify-content:center}
  .mk-rq .pill{background:rgba(15,199,123,.1);border:1.5px solid rgba(15,199,123,.4);border-radius:14px;padding:16px 26px;color:#cbd5cc;font-size:18px;line-height:1.45;max-width:520px}
  .mk-rq .pill b{color:#0FC77B;display:block;margin-bottom:4px;font-size:15px;letter-spacing:.05em}
  .mk-qtbl{margin-top:14px;background:rgba(255,255,255,.03);border:1.4px solid rgba(15,199,123,.18);border-radius:14px;padding:18px 24px}
  .mk-qtbl .qhd{color:#0FC77B;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .mk-qtbl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
  .mk-qrow{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05)}
  .mk-qrow b{color:#0FC77B;font-weight:800;font-size:15px;letter-spacing:.05em;flex-shrink:0;width:28px}
  .mk-qrow .qtxt{color:#cbd5cc;font-size:14.5px;line-height:1.35;flex:1}
  .mk-qrow .dim{color:#0FC77B;font-size:11px;text-transform:uppercase;letter-spacing:.08em;flex-shrink:0;opacity:.8;font-weight:700}
  .mk-params{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
  .mk-param{background:rgba(255,255,255,.04);border:1.5px solid rgba(15,199,123,.2);border-radius:14px;padding:20px 22px}
  .mk-param .lbl{color:#0FC77B;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  .mk-param .v{color:#fff;font-size:22px;font-weight:700;line-height:1.25}
  .mk-param .v small{color:#aab3ac;font-size:13px;font-weight:500;display:block;margin-top:3px}
  .mk-coding{background:rgba(255,255,255,.04);border:1.5px solid rgba(15,199,123,.2);border-radius:16px;padding:22px 26px}
  .mk-coding .hd{color:#0FC77B;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
  .mk-coding .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
  .mk-coding .grid div{color:#cbd5cc;font-size:15.5px;line-height:1.4}
  .mk-coding .grid div b{color:#0FC77B}
  .mk-echo{background:rgba(15,199,123,.08);border-left:4px solid #0FC77B;border-radius:0 14px 14px 0;padding:20px 24px}
  .mk-echo .hd{color:#0FC77B;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .mk-echo .body{color:#cbd5cc;font-size:16px;line-height:1.5}
  .mk-echo .body b{color:#fff;font-weight:600}
  /* slide 12 results-specific */
  .mk-stbl{width:100%;border-collapse:separate;border-spacing:0;background:rgba(255,255,255,.03);border:1.4px solid rgba(15,199,123,.18);border-radius:12px;overflow:hidden;font-size:15px}
  .mk-stbl th,.mk-stbl td{padding:9px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05)}
  .mk-stbl th{color:#0FC77B;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:rgba(15,199,123,.05)}
  .mk-stbl tr:last-child td{border-bottom:0}
  .mk-stbl .ai{color:#4fe0a6;font-weight:800;font-variant-numeric:tabular-nums}
  .mk-stbl .hu{color:#fbbf24;font-weight:800;font-variant-numeric:tabular-nums}
  .mk-stbl .dim{color:#cbd5cc;font-weight:600}
  .mk-find{background:rgba(255,255,255,.04);border:1.6px solid rgba(15,199,123,.22);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
  .mk-find .tag{color:#0FC77B;font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .mk-find h3{color:#fff;font-weight:700;font-size:18px;line-height:1.25;margin:0}
  .mk-find .row{display:flex;gap:10px;font-size:13.5px;line-height:1.4;color:#cbd5cc}
  .mk-find .lbl{flex:0 0 50px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:11px;padding-top:2px}
  .mk-find .lbl.r{color:#fbbf24}
  .mk-find .lbl.a{color:#4fe0a6}
  .mk-find .row .val{flex:1}
  .mk-summary{display:flex;justify-content:center;gap:40px;padding:14px 0;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);margin:14px 0 20px;font-size:18px;font-weight:700}
  .mk-summary .good{color:#4fe0a6}
  .mk-summary .bad{color:#fb7185}
  .mk-summary small{color:#aab3ac;font-weight:500;font-size:14px;margin-left:8px}
  .kicker{color:var(--accent);font-weight:700;letter-spacing:.16em;font-size:.95rem;margin-bottom:1.2rem;text-transform:uppercase}
  h1{font-size:clamp(2rem,4.4vw,3.7rem);line-height:1.14;font-weight:800;letter-spacing:-.02em}
  h2{font-size:clamp(1.55rem,3.1vw,2.5rem);line-height:1.2;font-weight:800;margin-bottom:1.4rem;letter-spacing:-.01em}
  h2 .u{color:var(--accent)}
  p.lead{font-size:clamp(1.05rem,1.7vw,1.38rem);color:var(--muted);line-height:1.6;max-width:64ch}
  ul{list-style:none;display:flex;flex-direction:column;gap:.85rem;margin-top:.4rem}
  li{font-size:clamp(1rem,1.65vw,1.34rem);line-height:1.45;padding-left:1.5rem;position:relative;max-width:64ch}
  li::before{content:"";position:absolute;left:0;top:.6em;width:.55rem;height:.55rem;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
  li small{display:block;color:var(--muted);font-size:.76em;margin-top:.2rem}
  .grid{display:grid;gap:1rem;margin-top:.4rem}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.4rem}
  .card h3{font-size:1.15rem;margin-bottom:.5rem}
  .card .who{color:var(--accent);font-weight:700}
  .card .step{color:var(--accent);font-weight:800;font-size:.9rem;letter-spacing:.04em;margin-bottom:.3rem}
  .card p{color:var(--muted);line-height:1.5;font-size:.96rem}
  .stat{display:flex;gap:3vw;flex-wrap:wrap;margin-top:.7rem}
  .stat .n{font-size:clamp(2rem,4.4vw,3.8rem);font-weight:800;letter-spacing:-.02em;line-height:1}
  .stat .n.good{color:var(--accent2)} .stat .n.bad{color:var(--bad)}
  .stat .lbl{color:var(--muted);font-size:.9rem;margin-top:.5rem;max-width:30ch}
  .six{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:.4rem 0 1rem}
  .six .d{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem}
  .six .d b{display:block;color:var(--accent);font-size:.98rem;margin-bottom:.3rem;letter-spacing:.01em;font-weight:800}
  .six .d span{color:var(--muted);font-size:.85rem;line-height:1.4;display:block}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.7rem;margin-top:.4rem}
  .col h3{font-size:1.2rem;margin-bottom:.7rem;display:flex;align-items:center;gap:.55rem}
  .tag{font-size:.74rem;padding:.16rem .6rem;border-radius:999px;font-weight:700}
  .tag.ai{background:rgba(15,199,123,.16);color:var(--accent)}
  .tag.hu{background:rgba(251,191,36,.16);color:var(--warn)}
  .title-wrap .meta{margin-top:2.4rem;color:var(--muted);font-size:1.02rem;line-height:1.9}
  .title-wrap .meta b{color:var(--ink);font-weight:700}
  .big{font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1.3;font-weight:800;letter-spacing:-.01em;max-width:26ch}
  .big .u{color:var(--accent)}
  .arrow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:.4rem 0 .9rem;font-weight:800;font-size:clamp(1rem,1.9vw,1.45rem)}
  .arrow .s1{color:var(--muted)} .arrow .s2{color:var(--accent)} .arrow .ar{color:var(--accent);font-size:1.3em}
  .meta2{margin-top:1.2rem;color:var(--muted);font-size:1.02rem}
  .divline{height:1px;background:var(--line);margin:1rem 0 .9rem}
  /* pipeline with arrows */
  .pipeline{display:flex;align-items:stretch;gap:1.5rem;flex-wrap:wrap;margin-top:.4rem}
  .pipeline .card{flex:1;min-width:0;position:relative}
  .pipeline .card:not(:last-child)::after{content:'→';position:absolute;right:-1.15rem;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:800;font-size:1.6rem;z-index:2}
  /* bar chart */
  .chart{margin:.5rem 0 .8rem;font-size:.9rem}
  .chart .leg{display:flex;gap:1.2rem;font-size:.78rem;color:var(--muted);justify-content:flex-end;margin-bottom:.7rem}
  .chart .leg .sw{width:11px;height:11px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:.35rem}
  .chart .row{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:.85rem;margin-bottom:.42rem}
  .chart .lbl{color:var(--ink);text-align:right;font-weight:700;font-size:.92rem}
  .chart .bars{display:flex;flex-direction:column;gap:3px}
  .chart .bar{height:10px;border-radius:3px;transition:width .4s}
  .chart .bar.ai{background:var(--accent)}
  .chart .bar.hu{background:var(--warn)}
  .chart .val{color:var(--muted);font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .chart .val .a{color:var(--accent)} .chart .val .h{color:var(--warn)}
  .chart .sum{display:flex;gap:2.5vw;justify-content:center;margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--line);font-weight:800}
  .chart .sum b{font-size:1.6rem;letter-spacing:-.01em} .chart .sum .good b{color:var(--accent)} .chart .sum .bad b{color:var(--bad)}
  .chart .sum span{color:var(--muted);font-size:.85rem;font-weight:500;margin-left:.35rem}
  /* living system flow */
  .flow{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;margin:.4rem 0 .9rem}
  .flow .node{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;text-align:center}
  .flow .node .ic{font-size:1.8rem;display:block;margin-bottom:.3rem}
  .flow .node .nm{font-weight:800;font-size:1.05rem}
  .flow .node.dest{border-color:var(--accent);background:rgba(15,199,123,.08)}
  .flow .ar2{color:var(--accent);font-weight:800;font-size:2rem}
  .feeders{display:flex;justify-content:center;gap:.6rem;color:var(--muted);font-size:.92rem;margin-bottom:.7rem}
  .feeders .f{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem}
  /* study 1 layout (design card + stats) */
  .s1-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin:.4rem 0 .9rem;align-items:stretch}
  .s1-grid .card{display:flex;flex-direction:column}
  .s1-stats{display:flex;flex-direction:column;justify-content:center;gap:1.4rem}
  .s1-stats .row{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
  .s1-stats .n{font-size:clamp(2.4rem,5vw,4rem);font-weight:800;line-height:1;color:var(--accent2);letter-spacing:-.02em}
  .s1-stats .n.big{font-size:clamp(3rem,6vw,5.2rem)}
  .s1-stats .lbl{color:var(--muted);font-size:.85rem;margin-top:.45rem;line-height:1.35}
  .s1-photo{margin-top:auto;background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:10px;min-height:130px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
  /* discussion: 3-role layout */
  .role-img{background:#1a1f1c;border:1px solid var(--line);border-radius:10px;height:190px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;overflow:hidden}
  .role-bar{display:flex;align-items:center;margin:.95rem 0 .55rem}
  .role-bar .dia{width:11px;height:11px;background:var(--accent);transform:rotate(45deg);flex-shrink:0;margin-right:.5rem}
  .role-bar::after{content:'';flex:1;height:1.5px;background:var(--accent)}
  .role-phase{color:var(--accent);font-weight:800;font-size:1.05rem;margin-bottom:.45rem;letter-spacing:.01em}
  .role-body{color:var(--ink);font-size:.92rem;line-height:1.55}
  .role-body .em{color:var(--accent2)}
  /* hook (scenario split) */
  .hook{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:.5rem}
  .hook .scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:280px;display:flex;flex-direction:column;justify-content:flex-end}
  .hook .scene.left{background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(251,113,133,.08))}
  .hook .scene.right{background:linear-gradient(135deg,rgba(15,199,123,.18),rgba(79,224,166,.08))}
  .hook .scene .photo{position:absolute;top:.7rem;right:.7rem;background:rgba(0,0,0,.35);color:var(--muted);font-size:.7rem;padding:.25rem .55rem;border-radius:6px;letter-spacing:.04em}
  .hook .scene .scenario{padding:1.1rem 1.2rem;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
  .hook .scene .label{color:var(--ink);font-weight:800;font-size:1.05rem;margin-bottom:.3rem}
  .hook .scene .sub{color:var(--muted);font-size:.92rem;line-height:1.4}
  .hook .scene .icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);font-size:4rem;opacity:.4}
  /* photo placeholder (used in body of other slides) */
  .ph{background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 10px,rgba(255,255,255,.02) 10px 20px);border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;letter-spacing:.04em;min-height:120px;flex-direction:column;gap:.3rem}
  .ph .ic{font-size:1.6rem;opacity:.7}
  /* hero tagline (giant centered) */
  .tagline{font-size:clamp(1.8rem,3.6vw,3rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--accent);margin:.4rem 0 .9rem}
  .tagline .ink{color:var(--ink)}
  /* insight callout box */
  .insight{background:rgba(15,199,123,.10);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:.85rem 1.1rem;margin-top:.9rem;font-size:1rem}
  .insight::before{content:"INSIGHT";display:inline-block;background:var(--accent);color:#04121a;font-size:.7rem;font-weight:800;letter-spacing:.14em;padding:.18rem .55rem;border-radius:4px;margin-right:.6rem;vertical-align:middle}
  .insight.warn{background:rgba(251,191,36,.10);border-left-color:var(--warn)}
  .insight.warn::before{background:var(--warn)}
  /* quote contrast */
  .qc{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:.4rem}
  .qc .qb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem;position:relative}
  .qc .qb.ai{border-color:rgba(15,199,123,.4)}
  .qc .qb.hu{border-color:rgba(251,191,36,.4)}
  .qc .qb .who{font-size:.75rem;letter-spacing:.16em;font-weight:800;text-transform:uppercase;margin-bottom:.6rem}
  .qc .qb.ai .who{color:var(--accent)} .qc .qb.hu .who{color:var(--warn)}
  .qc .qb .q{font-style:italic;font-size:1.02rem;line-height:1.5;color:var(--ink);margin-bottom:.55rem}
  .qc .qb .n{color:var(--muted);font-size:.85rem}
  /* RQ centered whitespace */
  .rq-center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:1.4rem}
  .rq-center .rq{font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:700;line-height:1.45;max-width:50ch;color:var(--ink)}
  .rq-center .rq b{color:var(--accent);margin-right:.5rem}
  /* QR codes */
  .qrrow{display:flex;gap:1.6rem;margin-top:1.4rem;flex-wrap:wrap}
  .qrrow .qrb{display:flex;align-items:center;gap:.85rem;background:#fff;border-radius:10px;padding:.6rem .8rem .6rem .6rem}
  .qrrow .qrb img{width:96px;height:96px;display:block}
  .qrrow .qrb .meta{color:#04121a;font-size:.8rem;font-weight:700;line-height:1.3}
  .qrrow .qrb .meta b{display:block;font-size:.88rem;margin-bottom:.18rem}

<script>
  const slides=[...document.querySelectorAll('.slide')];
  let i=0; const tot=slides.length;
  document.getElementById('tot').textContent=tot;

  const TIMES=["0:30","1:00","0:45","0:30","1:00","1:00","1:00","0:45","1:00","1:15","1:00","1:30","1:10","1:15","1:30","0:20","0:15"];
  const toSec=s=>{const[m,c]=s.split(':').map(Number);return m*60+c};
  function runningTime(n){let t=0;for(let k=0;k<=n;k++)t+=toSec(TIMES[k]||"0:00");const m=Math.floor(t/60),c=t%60;return m+':'+String(c).padStart(2,'0')};

  const NOTES=[
    {t:"開場｜Title",
     en:"Good morning. I'm Chieh-An from National Taiwan University of Science and Technology. Today I'd like to share with you the work I did with Prof. Tang on AI personas.",
     zh:"大家好。我是來自台灣科技大學的簡潔安。今天要跟大家分享我跟唐玄輝教授一起做的 AI 人物誌研究。"},
    {t:"背景與缺口｜Background & Gap",
     en:"With Generative AI, personas have become interactive agents you can actually talk to. Most existing work has asked 'how human-like is the AI?' But how AI personas differ from real participants still remains unclear. We looked at this question from a different angle. We wanted to know what value this difference brings, and how it changes the way we do design research.",
     zh:"有了生成式 AI，人物誌變成可以對話的代理人。過去多數研究都在問「AI 像不像真人」，但 AI 人物誌跟真人之間的差異到底是什麼，目前還不清楚。我們從另一個角度切入，想知道這個差異本身有什麼價值、會如何改變我們做設計研究的方式。"},
    {t:"研究問題｜RQ",
     en:"So we asked two questions. First, how to build an AI persona that stays consistent and is clearly different from other personas? Second, what are the structural differences in language between AI personas and real people?",
     zh:"我們問了兩個問題。第一，怎麼建構一個一致、可區辨的 AI 人物誌？第二，AI 人物誌跟真人在語言表現上有哪些結構性差異？"},
    {t:"研究流程 + DSR｜Method · Research Process",
     en:"We built our AI persona using Design Science Research. We treated the AI persona as an artifact: we build it, then we evaluated it across two studies that were designed to answer our two RQs.",
     zh:"我們用設計科學研究方法建構 AI 人物誌。把它當成一個人造物：先建構出來，再用兩個對應我們兩個 RQ 的研究去評估它。"},
    {t:"研究情境｜Method · Context",
     en:"To test if our AI persona can be truly consistent, we had to build two distinct and contradictory AI personas that can be compared to each other. We therefore needed a real-world context where two contradictory personas can be observed at the same time. We used Taiwan's Gen Z investors of ETF as our context. We picked them because they are as rational as they are emotional. This difference would allow us to build personas that have distinct behaviors.",
     zh:"要測試 AI 人物誌是不是真的一致，我們需要做出兩個截然不同、甚至對立的 AI 人物誌來互相比對。所以我們需要一個真實世界的情境，在裡面同時看得到這兩種對立的角色。我們選了台灣 Z 世代 ETF 投資者當情境，因為他們又理性又情緒化，這種落差讓我們能建出行為差異明顯的角色。"},
    {t:"建構流程｜Construct",
     en:"We built the persona in four stages. In the first stage, we used Gemini Deep Research to identify two core axes and four user types, and then build a full profile for each quadrant. Second, to train our personas, we used ChatGPT Deep Research to pull thirty to fifty posts of a first-person voice from Taiwanese online forums. That is where the persona's voice comes from. Third, we wrote a six-dimension script for the personas. Finally, we shipped the script as a GPT with five behavior constraints and role-internalization instructions, so the persona stays in character through long conversations.",
     zh:"我們分四階段建角色。第一階段，建立脈絡：用 Gemini Deep Research 找出兩條核心軸線跟四種用戶類型，再把十字象限四個類型完整刻劃出來。第二階段，語料蒐集：用 ChatGPT Deep Research 從台灣論壇 PTT、Dcard 抓 30 到 50 則第一人稱貼文，角色的聲音來自這裡。第三階段，劇本生成：寫出六維度劇本。第四階段，部署：把劇本上 GPT，加上 5 條行為限制跟角色內化指令，讓角色在長對話中不脫線。"},
    {t:"六維度｜Six Dimensions",
     en:"For the script, we considered six dimensions. Basic information anchors the identity of the persona, which is a she. Worldview shapes how she sees the market, money, and the future. Psychological state captures what makes her anxious and where her confidence comes from. Behavior covers her daily rituals, like checking the app or chatting with friends. Linguistic style locks in the things that make her sound like herself: slang, particles, tempo. And daily scenarios put her into real situations like commute, payday, or a market crash. Together, these six dimensions hold one stable character across hundreds of turns.",
     zh:"劇本有六個維度。基本資料負責錨定角色身份，這個角色是一位女性，包含年齡、職業、人生階段。世界觀形塑她怎麼看市場、金錢、未來。心理狀態抓住她在焦慮什麼、信心從哪裡來。行為模式涵蓋她每天的習慣，像是刷盤、找朋友聊天。語言風格鎖住「一聽就知道是她」的東西，俚語、語助詞、節奏。日常情境把她放進真實場景，像通勤、發薪日、市場崩盤。六個維度一起撐住一個穩定的角色，撐過上百回合對話。"},
    {t:"兩位角色｜Two Personas",
     en:"We built two opposite personas by flipping one axis, source of confidence, and keeping the rest the same. Take a look at how they answer the same question. Ann's decisions, quote unquote, get pulled along by social platforms. When PTT or her friends are talking about a stock, she follows. Her must-haves are price alerts and trending rankings, because she wants to react fast. On the other hand, Emily, quote unquote, doesn't watch news or YouTube. Her decisions rest on principles she set from the start, low cost, global diversification, long-term returns. Her must-haves are automated recurring investments and rebalancing, because she wants the app to help her stay the course. Same question, completely different answers.",
     zh:"我們建了兩個對立的角色，只翻轉一條軸線——信心來源——其他都相同。大家可以看一下她們對同樣問題的回答。小安的決定，引用她原話，「被社群平台帶著走」。PTT 跟朋友在講什麼，她就想跟。她的必備功能是價格警示跟熱門排行，因為她想趕快反應。另一方面，艾蜜莉，引用她原話，「不看新聞跟 YouTube」。她的決定建立在自己一開始就設好的原則上：低成本、全球分散、長期報酬。她的必備功能是定期定額跟再平衡，因為她要 app 幫她守紀律。同樣的問題，完全不同的答案。"},
    {t:"研究一設計｜Study 1 · Design",
     en:"To answer RQ1, the consistency question, we ran Study 1. We invited six senior designers, each with three or more years of UX research experience. None of them were involved in building the persona, so they could evaluate it objectively. We designed six interview questions, with each question targeting one dimension of the script, so we could see which dimensions hold up under repeated questioning. The protocol had three parts, all in one session. First, a stability test: three rounds with Anne using these six questions, rated on a five-point scale from completely inconsistent to completely consistent. Second, a discriminability test: one round with Emily using the same six questions, this time rating whether Anne and Emily's answers felt identical or very different. Third, separately, the Persona Perception Scale from Salminen and colleagues, which rates six perception constructs on a one-to-seven Likert.",
     zh:"為了回答 RQ1 一致性的問題，我們做了研究一。我們邀請了六位資深設計師，都是有三年以上 UX 研究經驗的人。他們沒有參與人物誌的建構，所以可以客觀評估。我們設計了六道訪談題，每題對應劇本的一個維度，這樣可以看出哪些維度在重複提問下站得住腳。流程分三個部分，都在同一場進行。第一，穩定性測試：跟小安進行三輪對話，用這六道題，1 到 5 分量表評分，1 是完全不一致、5 是完全一致。第二，差異性測試：跟艾蜜莉進行一輪對話，用同樣的六道題，這次評的是小安跟艾蜜莉的回答一樣或不同。第三，另外搭配人物誌感知量表，這是 Salminen 等人 2020 年發展的，用 1 到 7 分量表評六個感知面向。"},
    {t:"研究一結果｜Study 1 · Results",
     en:"Now for the results. Anne was consistent at 4.17, and the two personas were clearly distinct at 4.58. On the perception scale, clarity was highest, and credibility was lowest at 3.07. This actually reflects a boundary. The evaluators could clearly distinguish AI from real people, which shows the designers maintained appropriate critical awareness about the nature of the tool.",
     zh:"結果這樣。小安一致性 4.17，兩角色差異性 4.58、清楚可辨。感知量表清晰度最高、可信度最低 3.07。這正反映了一個邊界：評估者能清楚辨識 AI 與真人的差異，顯示設計師對工具本質保有批判意識。"},
    {t:"研究二設計｜Study 2 · Design",
     en:"For RQ2, we ran Study 2 as a simulation-validation interview. The participants were AI Anne plus two screened humans aged 24 and 26, both matching Anne's Gen Z emotional profile. Each session was 60 minutes, conducted online. The design brief was: when market volatility triggers panic, how do we stabilize emotional investors so they don't deviate from their investment plan. We developed three design concepts as interview stimuli. Every participant reacted to all three, with the same four questions per concept: first reaction, behavior or emotion impact, understanding shift, and what works versus what doesn't.",
     zh:"為了回答 RQ2，我們做了研究二，採用「模擬驗證型訪談」。受訪者是 AI 小安加上兩位篩選過的真人，24 跟 26 歲，都符合小安的 Z 世代情緒型投資者輪廓。每場 60 分鐘線上訪談。設計題目是：當市場波動引發恐慌時，如何穩定情緒型投資者讓他們不偏離投資計畫。我們做了三個設計方案當作刺激物。三位受訪者都針對這三個方案回應，每個方案問同樣四題：第一反應、對行為或情緒的影響、是否改變對情境的理解、哪些有效哪些無效及為什麼。"},
    {t:"研究二結果｜Study 2 · Results",
     en:"Two dimensions tell the story. First, C2, variability: real humans drop hundreds of hesitation markers per interview — fillers, restarts, broken sentences. The AI dropped zero, replaced by emoji. Perfectly polished, exactly the giveaway. Second, C6, reflective tempo: real reflection takes about four minutes to surface; it has to be constructed. The AI gives deeper reflection than humans, but instantly, at zero delay. Across all six dimensions, AI is plus-43% structural but minus-79% authenticity. The same fluency that looks excellent is exactly what makes the authenticity gap visible.",
     zh:"兩個維度就把整個故事說清楚了。第一，C2 變化程度：真人每場訪談有幾百個語氣詞跟遲疑——口頭禪、自我修正、破碎句子。AI 是零，用 emoji 代替。太完美，正是破綻。第二，C6 思考節奏：真人的反思大約要四分鐘才浮現，是被建構出來的。AI 反思的深度比真人還深，但是零延遲秒答。六個維度合起來看，AI 結構性高真人 43%，真實性低真人 79%。讓 AI 看起來優異的那份流暢，正是讓真實性差距被看見的原因。"},
    {t:"兩種思考｜Two Modes",
     en:"And this isn't just a small difference, it's a different kind of thinking. The AI does what we call synthetic thinking: the answer is already there before the question finishes, zero delay, only three interaction markers. The human does experiential thinking: the answer forms while she's speaking, 45 interaction markers, and the real reflection often only surfaces about four minutes later.",
     zh:"這不只是程度差異，是兩種思考方式的差別。AI 是我們說的「合成式思考」：答案在問題講完之前就成形了，零延遲、只有三個互動標記。真人是「經歷中的思考」：答案是邊講邊形成的，45 個互動標記，真正的反思常常是四分鐘後才浮現。"},
    {t:"對照基準與互補｜Baseline & Complementary",
     en:"So the AI's real value isn't to simulate humans, it's to be a reference baseline. AI personas are efficient and always available, so they fit the early stage: exploring the problem space, finding patterns, giving designers something solid to compare against. Human interviews bring what AI can't: hesitation, contradiction, emotion. Once you have the AI baseline, those human signals become meaningful, not noise. The AI's fluency is exactly what makes them stand out. So AI and humans are complementary, not competing. Different tools for different jobs: AI for breadth early on, humans for depth later.",
     zh:"所以 AI 真正的價值不是模擬真人，而是當對照基準。AI 人物誌效率高、隨時可用，適合前期：探索問題空間、找出模式，讓設計師有個明確的東西可以對照。真人訪談則帶來 AI 給不了的：遲疑、矛盾、情緒。一旦有了 AI 對照，這些真人訊號才變成有意義的訊號，不再是雜訊；AI 的流暢正是讓它們被凸顯出來的原因。所以 AI 跟真人是互補的，不是競爭。不同工具做不同事：AI 適合前期廣度，真人適合後期深度。"},
    {t:"活系統與貢獻｜Living + Contributions",
     en:"This points to a future direction we call a living system. Once the persona is consistent, it can keep evolving by absorbing new data: designer interview records, and CRM data from real users. To wrap up, we have three contributions. Methodologically, a validated six-dimension framework. Conceptually, the synthetic-versus-experiential distinction, which moves the field beyond just measuring fidelity. And practically, a clear positioning: AI for breadth, humans for depth.",
     zh:"這指向一個未來方向，我們叫它「活系統」。一旦人物誌穩定了，就能透過吸收新資料持續演化：設計師的訪談紀錄、以及真實使用者的 CRM 資料。最後三個貢獻。方法上，經驗證的六維度框架。概念上，合成式 vs 經歷中思考的區分，讓這個領域不再只比擬真度。實務上，明確的定位：AI 廣度、真人深度。"},
    {t:"結論｜Conclusion",
     en:"From static snapshot to a living system. AI personas don't replace humans, they complement; and once consistent, they can keep growing with continuous data.",
     zh:"從靜態快照到活系統。AI 人物誌不取代真人，而是互補；一旦一致，就能透過資料持續成長。"},
    {t:"致謝｜Thank You",
     en:"Thank you. I would love to take your questions.",
     zh:"謝謝聆聽，很歡迎提問。"}
  ];

  const SRC=[
    {en:"From Static Snapshot to Living System: The Evolution of AI Personas and the Researcher's Reflective Practice.",
     zh:"從靜態快照到活系統：AI 人物誌的演化與研究者的反思實踐。"},
    {en:"Personas are widely used in design research, yet their static nature limits capturing users' dynamic changes. Generative AI enables personas to become interactive agents, but the differences between AI personas and human participants remain underexplored. We take a difference-analysis approach rather than a fidelity-evaluation approach.",
     zh:"人物誌廣泛用於設計研究，但其靜態特質限制了捕捉使用者的動態變化。生成式 AI 使人物誌成為可互動的代理，但 AI 人物誌與真人受訪者之間的差異仍未被充分探討。我們採差異分析取向，而非擬真度評估取向。"},
    {en:"RQ1: How can we construct consistent and discriminable AI personas for design research? RQ2: What are the structural differences in linguistic performance between AI personas and human participants?",
     zh:"RQ1：如何建構一致且可區辨、可用於設計研究的 AI 人物誌？RQ2：AI 人物誌與真人受訪者在語言表現上有哪些結構性差異？"},
    {en:"This study adopts Design Science Research (DSR) as its core approach, constructing and evaluating artifacts to solve a practical problem and accumulate generalizable design knowledge (Hevner et al., 2004; Peffers et al., 2007).",
     zh:"本研究以設計科學研究方法（DSR）為核心取徑，透過建構與評估人造物來解決實務問題、累積可推廣的設計知識（Hevner 等, 2004；Peffers 等, 2007）。"},
    {en:"Context: Taiwan's Gen Z ETF investors, for their evident emotional-behavioral coupling.",
     zh:"研究情境為台灣 Z 世代 ETF 投資者，因其情緒與行為高度連動。"},
    {en:"Data collection proceeded in three stages, all using Gemini 2.5. Stage 1 (Secondary): a senior market analyst produced an exploratory market report. Stage 2 (Primary): a precise data extraction assistant pulled first-person narratives from PTT and Dcard. Stage 3 (Script): integrated the data into the six-dimension script, then deployed as a GPT.",
     zh:"資料蒐集分三階段，全程用 Gemini 2.5。第一階段（二手）：化身資深市場分析師產出探索性市場報告。第二階段（一手）：化身精準資料擷取助理，從 PTT 與 Dcard 擷取第一人稱敘事。第三階段（劇本）：整合資料為六維度劇本，再部署為 GPT。"},
    {en:"The six dimensions: Basic Information (identity anchoring), Worldview (interpretive tendencies and decision logic), Psychological State (emotional contour and narrative drive), Behavioral Patterns (daily coping strategies), Linguistic Repertoire (recognizable verbal markers), Daily Life Scenarios (ecologically valid contexts).",
     zh:"六個維度：基本資料（身份錨定）、世界觀（詮釋傾向與決策邏輯）、心理狀態（情感輪廓與敘事動力）、行為模式（日常應對策略）、語言詞彙庫（可辨識的口語標記）、日常生活分鏡（生態有效情境）。"},
    {en:"Two contrasting personas built on the same script: Anne, 23, marketing intern, emotional / externally validated; Emily, 25, data analyst, rational / internally driven. They share the six-dimension scaffold but invert on the source-of-confidence axis.",
     zh:"以同一劇本建構兩位對比角色：小安，23 歲行銷實習生，情緒型／外部確認型；艾蜜莉，25 歲數據分析師，理性型／內在信念型。共用六維度框架，但在「信心來源」軸上相反。"},
    {en:"Study 1 protocol: six expert evaluators (3+ years) ran three consistency rounds with Anne and one discriminability round with Emily, using identical questions, then completed the Persona Perception Scale (Salminen et al., 2020) which rates credibility, consistency, completeness, clarity, empathy, and willingness-to-use.",
     zh:"研究一流程：六位專家評估者（三年以上經驗）與小安進行三輪一致性測試、與艾蜜莉進行一輪差異性測試，使用相同題目，最後填寫人物誌感知量表（Salminen 等, 2020），評估可信度、一致性、完整性、清晰度、同理心與使用意願。"},
    {en:"Six expert evaluators (3+ years). Consistency M = 4.17 (SD = 0.85), 87.5% in 4 to 5 range; discriminability M = 4.58 (SD = 0.70). On the Persona Perception Scale, Clarity was highest (6.22), Credibility lowest (3.07).",
     zh:"六位專家評估者（三年以上經驗）。一致性 M = 4.17（SD = 0.85），87.5% 落在 4 到 5；差異性 M = 4.58（SD = 0.70）。人物誌感知量表中，清晰度最高（6.22）、可信度最低（3.07）。"},
    {en:"Study 2 protocol: 60-minute design probe interviews with Anne and two human participants (24 and 26), using three design concepts (past / present / future) as stimuli, coded on six dimensions C1–C6 (1–5 scale). Interaction markers were counted as a real-time thinking signal: hesitations, fillers, clarifying questions, and self-corrections.",
     zh:"研究二流程：以小安與兩位真人受訪者（24、26 歲）進行 60 分鐘設計探針訪談，用三個設計方案（過去／現在／未來）作為刺激物，以六維度 C1–C6（1–5 量表）編碼；另計算互動標記作為即時思考訊號：遲疑、口頭禪、追問與自我修正。"},
    {en:"On structural dimensions (C1, C5), AI scored 5.0 vs humans 3.5 (a 43% advantage). On authenticity dimensions (C2, C3, C4, C6), humans scored 4.88 vs AI 1.05 (a 79% disadvantage). The AI is a respondent with excellent structure but limited authenticity.",
     zh:"結構性維度（C1、C5）AI 得 5.0、真人 3.5（優勢 43%）；真實性維度（C2、C3、C4、C6）真人 4.88、AI 1.05（劣勢 79%）。AI 是一個結構優異但真實性不足的受訪者。"},
    {en:"Synthetic Thinking (AI): immediate assembly of patterns with zero delay; the answer is 'pre-formed', it exists before the question ends. Experiential Thinking (humans): gradual construction through perception, memory, and emotion; the answer is 'being formed', thinking happens while speaking.",
     zh:"合成式思考（AI）：即時組裝模式、零延遲；答案是「預先成形」的，問題還沒講完答案就在了。經歷中的思考（真人）：透過感知、記憶、情緒逐步建構；答案是「正在成形」的，思考在說話時發生。"},
    {en:"AI personas' value lies not in simulating humans, but in serving as a reference baseline that makes human cognitive patterns visible. Different tools serve different purposes, not competing alternatives: AI fits early exploration; human interviews fit later validation and depth.",
     zh:"AI 人物誌的價值不在於模擬真人，而在於作為對照基準，讓真人的認知模式被看見。不同工具各司其職，而非相互競爭：AI 適合前期探索；真人訪談適合後期驗證與深度。"},
    {en:"Consistency is the prerequisite for meaningful evolution. With Designer Interview Data (depth and context) and Automated CRM Data (breadth and currency), a persona can turn from a static snapshot into a living system. Contributions: (1) a validated Six-Dimension Script Methodology; (2) a conceptual framework distinguishing synthetic from experiential thinking; (3) practical guidance positioning AI personas as complementary tools (AI for breadth, humans for depth).",
     zh:"一致性是有意義演化的前提。透過設計師訪談資料（深度與脈絡）與自動化 CRM 資料（廣度與即時性），人物誌可以從靜態快照轉為活系統。貢獻：(1) 經驗證的六維度劇本方法論；(2) 區分合成式與經歷中思考的概念框架；(3) 將 AI 人物誌定位為互補工具的實務指引（AI 廣度、真人深度）。"},
    {en:"We constructed consistent, discriminable AI personas and revealed a structural difference between synthetic and experiential thinking. AI personas are best positioned as complementary tools that, once consistent, can evolve through continuous data integration: from static snapshot to living system.",
     zh:"我們建構出一致且可區辨的 AI 人物誌，並揭示合成式與經歷中思考的結構性差異。AI 人物誌最適合定位為互補工具，一旦一致就能透過持續的資料整合演化：從靜態快照到活系統。"},
    {en:"",zh:""}
  ];

  function show(n){
    try{player.pause();}catch(e){}
    i=Math.max(0,Math.min(tot-1,n));
    slides.forEach((s,k)=>s.classList.toggle('active',k===i));
    document.getElementById('cur').textContent=i+1;
    document.getElementById('bar').style.width=((i+1)/tot*100)+'%';
    const nt=NOTES[i]||{t:'',en:'',zh:''};
    document.getElementById('tm').textContent='⏱ '+(TIMES[i]||'')+'　(running '+runningTime(i)+')';
    document.getElementById('sn').textContent=nt.t;
    document.getElementById('nen').textContent=nt.en;
    document.getElementById('nzh').textContent=nt.zh;
    const sr=SRC[i]||{en:'',zh:''};
    const srcEl=document.getElementById('src');
    if(sr.en||sr.zh){srcEl.style.display='block';document.getElementById('srcen').textContent=sr.en;document.getElementById('srczh').textContent=sr.zh;}
    else{srcEl.style.display='none';}
    requestAnimationFrame(()=>{try{fitMockups();}catch(e){}});
  }
  function next(){show(i+1)} function prev(){show(i-1)}
  document.getElementById('next').onclick=next;
  document.getElementById('prev').onclick=prev;
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')next();
    else if(e.key==='ArrowLeft')prev();
  });
  function toggleNotes(){document.body.classList.toggle('notes-open');requestAnimationFrame(()=>setTimeout(fitMockups,310))}
  document.getElementById('toggle').onclick=(e)=>{e.stopPropagation();toggleNotes()};

  /* ===== scale .mk to fit slide container ===== */
  function fitMockups(){
    document.querySelectorAll('.slide.mock-slide').forEach(s=>{
      const mk=s.querySelector('.mk');if(!mk)return;
      const cw=s.clientWidth,ch=s.clientHeight;if(!cw||!ch)return;
      const sc=Math.min(cw/1920,ch/1080);
      mk.style.transform=`translate(-50%,-50%) scale(${sc})`;
    });
  }
  window.addEventListener('resize',fitMockups);
  setTimeout(fitMockups,50);

  /* ===== 朗讀（預先生成音檔，失敗退回系統語音）===== */
  let RATE=0.85;
  const player=new Audio(); player.preload='none';
  function speakFallback(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=RATE;speechSynthesis.speak(u);}catch(e){}}
  function readAloud(){
    try{speechSynthesis.cancel();}catch(e){}
    const en=NOTES[i].en||'';
    player.onerror=()=>{speakFallback(en.replace(/[：]/g,', ').replace(/[；]/g,'; ').replace(/[（）]/g,' '));};
    player.src='audio/s'+i+'.mp3';
    player.playbackRate=RATE;
    try{player.currentTime=0;}catch(e){}
    player.play().catch(()=>{});
  }
  document.getElementById('readBtn').onclick=readAloud;
  document.getElementById('stopBtn').onclick=()=>{try{player.pause();player.currentTime=0;}catch(e){}try{speechSynthesis.cancel();}catch(e){}};
  document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>{
    RATE=parseFloat(b.dataset.r);
    document.querySelectorAll('.rate').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    try{player.playbackRate=RATE;}catch(e){}
  });

  document.body.classList.add('notes-open');
  show(0);
</script>
</body>
</html>
