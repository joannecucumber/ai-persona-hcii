<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>對照檢查 · 中文簡報 + 講稿</title>
<style>
  :root{
    --bg:#0a0e0b;--card:#141a15;--line:rgba(15,199,123,.22);--accent:#0FC77B;
    --ink:#f1f3f2;--muted:#aab3ac;--warn:#fbbf24;--warn-bg:rgba(251,191,36,.1)
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Inter',-apple-system,sans-serif;line-height:1.65}
  .wrap{max-width:1520px;margin:0 auto;padding:44px 32px 120px}
  header{border-bottom:2px solid var(--accent);padding-bottom:20px;margin-bottom:36px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px}
  header .l .kicker{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:10px}
  header .l h1{font-size:26px;font-weight:800;line-height:1.3;margin-bottom:8px}
  header .l h1 .accent{color:var(--accent)}
  header .l .meta{color:var(--muted);font-size:13px;line-height:1.6}
  header .l .meta b{color:var(--ink)}
  header .r{display:flex;gap:14px;flex-wrap:wrap}
  header .r a{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 14px;font-size:13px;text-decoration:none;border-radius:6px;transition:.2s}
  header .r a:hover{background:var(--accent);color:#04121a;border-color:var(--accent)}

  .item{display:grid;grid-template-columns:1.9fr 1fr;gap:24px;margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid rgba(15,199,123,.1)}
  .item-head{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .item-head .no{background:var(--accent);color:#04121a;font-weight:800;font-size:12px;letter-spacing:.1em;padding:4px 10px;border-radius:5px;font-family:'Consolas','SF Mono',monospace}
  .item-head h2{font-size:17px;font-weight:700;color:var(--ink);flex:1}
  .item-head .sec{font-family:'Consolas','SF Mono',monospace;color:var(--muted);font-size:13px}
  .item-head .sec b{color:var(--accent)}

  .frame{position:relative;width:100%;aspect-ratio:16/9;border:1.6px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
  .slide-inner{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left}
  .slide-inner .slide{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column;justify-content:center;opacity:1!important;padding:48px 72px;overflow:hidden;
    background-image:
      linear-gradient(rgba(15,199,123,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(15,199,123,.025) 1px,transparent 1px),
      radial-gradient(1000px 700px at 15% 0%,rgba(15,199,123,.06),transparent 60%);
    background-size:64px 64px,64px 64px,100% 100%;background-repeat:repeat,repeat,no-repeat}
  .slide-inner .slide::after{content:'';position:absolute;bottom:0;left:0;right:0;height:10px;background:var(--accent)}

  .slide-inner .kicker{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px}
  .slide-inner h1.main{font-size:28px;font-weight:800;line-height:1.28;letter-spacing:-.01em;margin-bottom:14px;color:var(--ink)}
  .slide-inner h1.main .accent{color:var(--accent)}
  .slide-inner h1.main.big{font-size:36px}
  .slide-inner .lead{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:14px;max-width:88ch}
  .slide-inner .lead b{color:var(--ink);font-weight:600}
  .slide-inner .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .slide-inner .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  .slide-inner .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:10px}
  .slide-inner .card{background:var(--card);border:1.6px solid var(--line);border-radius:12px;padding:12px 16px}
  .slide-inner .card .lbl{color:var(--accent);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
  .slide-inner .card h3{color:var(--ink);font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px}
  .slide-inner .card p{color:var(--muted);font-size:12px;line-height:1.55}
  .slide-inner .card p b{color:var(--ink);font-weight:600}
  .slide-inner .card p + p{margin-top:5px}
  .slide-inner .card .num{color:var(--accent);font-size:22px;font-weight:800;line-height:1;margin-bottom:4px}
  .slide-inner .list{margin:6px 0 0;padding:0;list-style:none}
  .slide-inner .list li{position:relative;padding:3px 0 3px 14px;color:var(--muted);font-size:12px;line-height:1.5}
  .slide-inner .list li::before{content:'';position:absolute;left:0;top:11px;width:5px;height:5px;background:var(--accent);border-radius:50%}
  .slide-inner .list li b{color:var(--ink);font-weight:600}
  .slide-inner blockquote{background:rgba(15,199,123,.06);border-left:3px solid var(--accent);padding:8px 14px;border-radius:0 8px 8px 0;color:var(--ink);font-size:13px;line-height:1.5;margin:10px 0;font-style:italic}
  .slide-inner blockquote.warn{background:var(--warn-bg);border-left-color:var(--warn)}
  .slide-inner blockquote b{color:var(--accent);font-style:normal}
  .slide-inner blockquote.warn b{color:var(--warn)}
  .slide-inner .ref{color:var(--muted);font-size:10px;opacity:.7;margin-top:10px;font-style:italic}
  .slide-inner .rq-num{display:inline-block;background:var(--accent);color:#04121a;font-weight:800;padding:3px 10px;border-radius:5px;font-size:11px;letter-spacing:.05em;margin-bottom:6px}
  .slide-inner .stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
  .slide-inner .stat{flex:1;min-width:70px}
  .slide-inner .stat .v{color:var(--accent);font-size:26px;font-weight:800;line-height:1}
  .slide-inner .stat .v.warn{color:var(--warn)}
  .slide-inner .stat .k{color:var(--muted);font-size:11px;margin-top:3px}
  .slide-inner .stat .k b{color:var(--ink)}
  .slide-inner table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
  .slide-inner th,.slide-inner td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
  .slide-inner th{color:var(--accent);font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(15,199,123,.08)}
  .slide-inner td.muted{color:var(--muted);font-size:11px}
  .slide-inner .contrast{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-top:10px}
  .slide-inner .contrast .side{background:var(--card);border:1.6px solid var(--line);border-radius:12px;padding:12px 14px}
  .slide-inner .contrast .side.ai{border-color:rgba(15,199,123,.4)}
  .slide-inner .contrast .side.hu{border-color:rgba(251,191,36,.4)}
  .slide-inner .contrast .side .lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
  .slide-inner .contrast .side.ai .lbl{color:var(--accent)}
  .slide-inner .contrast .side.hu .lbl{color:var(--warn)}
  .slide-inner .contrast .side h4{color:var(--ink);font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.3}
  .slide-inner .contrast .side p{color:var(--muted);font-size:12px;line-height:1.5}
  .slide-inner .contrast .side p + p{margin-top:5px}
  .slide-inner .contrast .side p b{color:var(--ink)}
  .slide-inner .contrast .vs{color:var(--muted);font-weight:800;font-size:13px;display:flex;align-items:center}
  .slide-inner .thanks{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px}
  .slide-inner .thanks h1{font-size:66px;color:var(--accent);font-weight:800;letter-spacing:.05em}
  .slide-inner .thanks .p{color:var(--muted);font-size:20px}
  .slide-inner .cover{padding:56px 88px}
  .slide-inner .cover .badge{color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px;padding:5px 12px;border:1.5px solid var(--accent);border-radius:5px;display:inline-block;width:fit-content}
  .slide-inner .cover h1{font-size:48px;font-weight:800;line-height:1.15;margin-bottom:12px;letter-spacing:-.01em}
  .slide-inner .cover h1 .accent{color:var(--accent)}
  .slide-inner .cover .subtitle{color:var(--muted);font-size:18px;line-height:1.4;margin-bottom:20px;max-width:60ch}
  .slide-inner .cover .abs{color:var(--ink);font-size:14px;line-height:1.6;max-width:75ch;margin-bottom:24px}
  .slide-inner .cover .abs b{color:var(--accent)}
  .slide-inner .cover .meta{color:var(--muted);font-size:14px;line-height:1.8}
  .slide-inner .cover .meta b{color:var(--ink)}
  .slide-inner .toc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 20px;margin-top:10px}
  .slide-inner .toc-col h3.toc-chap{color:var(--accent);font-size:13px;font-weight:800;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid rgba(15,199,123,.25)}
  .slide-inner .toc-secs{list-style:none;padding:0;margin:0}
  .slide-inner .toc-secs > li{color:var(--muted);font-size:10.5px;line-height:1.55;padding:1px 0}
  .slide-inner .timeline{display:flex;gap:10px;margin-top:10px}
  .slide-inner .timeline .tl-item{flex:1;background:var(--card);border:1.6px solid var(--line);border-radius:10px;padding:10px 12px}
  .slide-inner .timeline .tl-item .year{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.06em;margin-bottom:4px}
  .slide-inner .timeline .tl-item h4{color:var(--ink);font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3}
  .slide-inner .timeline .tl-item p{color:var(--muted);font-size:11px;line-height:1.5}

  .script-wrap{display:flex;flex-direction:column;gap:12px}
  .script-body{color:var(--ink);font-size:14px;line-height:1.8;letter-spacing:.02em;background:var(--card);border:1.6px solid var(--line);border-radius:10px;padding:16px 18px;flex:1}
  .script-body p{margin-bottom:10px}
  .script-body p:last-child{margin-bottom:0}
  .script-body b{color:var(--accent);font-weight:600}
  .cue{background:rgba(251,191,36,.08);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 8px 8px 0;color:var(--warn);font-size:12px;line-height:1.5}
  .cue b{color:var(--warn);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10px;display:block;margin-bottom:3px}

  .toc-bar{position:sticky;top:0;background:rgba(10,14,11,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 32px;margin:0 -32px 24px;z-index:10;display:flex;gap:4px;overflow-x:auto}
  .toc-bar a{color:var(--muted);text-decoration:none;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;font-family:'Consolas','SF Mono',monospace;transition:.15s}
  .toc-bar a:hover{background:var(--accent);color:#04121a}

  @media (max-width:1000px){
    .item{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff;color:#000}
    .toc-bar,header .r{display:none}
    .item{break-inside:avoid;grid-template-columns:1fr 1fr}
    .script-body{background:#fff;color:#000;border-color:#ccc}
    .script-body b{color:#0a7548}
    .cue{background:#fff8e0;color:#875f00}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="l">
    <div class="kicker">對照檢查頁 · Review</div>
    <h1><span class="accent">AI Persona</span> 論文口試 · 簡報 + 講稿</h1>
    <div class="meta"><b>簡潔安</b>　26 頁 · 20 分鐘 · 每頁對應論文一節</div>
  </div>
  <div class="r">
    <a href="thesis-zh.html">▶ 開簡報</a>
    <a href="thesis-zh-presenter.html">📖 Presenter</a>
    <a href="thesis-zh-script.html">📄 純講稿</a>
  </div>
</header>

<div class="toc-bar" id="toc-bar"></div>

<div id="items"></div>

</div>

<script src="thesis-zh-scripts.js"></script>
<script>
  const S=window.THESIS_ZH_SCRIPTS;

  const SLIDES=[
    // S1 封面
    `<section class="slide cover"><div class="badge">碩士論文口試</div><h1>AI Persona 能取代<br><span class="accent">真人訪談</span>嗎？</h1><div class="subtitle">探討 AI Persona 與真人受訪者的差異對設計研究的影響</div><div class="abs">本研究不探討 AI Persona 與真人的<b>相似程度</b>，而探討兩者之間的<b>結構性差異</b>，以及此差異對設計研究的意涵。透過設計科學研究方法、六維度劇本方法論的建構，並與真人受訪者進行系統性比較，我們主張 AI Persona 的價值不在模擬真人，而在作為對照基準。</div><div class="meta"><b>簡潔安</b>　指導教授：<b>唐玄輝 博士</b><br>國立臺灣科技大學　設計系碩士班　學號：M11110914</div></section>`,
    // S2 目錄
    `<section class="slide"><div class="kicker">目錄</div><h1 class="main">論文架構 · <span class="accent">六章</span></h1><div class="toc-grid">
      <div class="toc-col"><h3 class="toc-chap">第一章 緒論</h3><ul class="toc-secs"><li>1.1 研究背景</li><li>1.2 研究問題與目的</li><li>1.3 研究範圍與限制</li><li>1.4 論文架構</li></ul></div>
      <div class="toc-col"><h3 class="toc-chap">第二章 文獻探討</h3><ul class="toc-secs"><li>2.1 人物誌方法論的演進</li><li>2.2 生成式 AI 與角色模擬</li><li>2.3 AI 在設計流程中的角色</li><li>2.4 小結：研究缺口與本研究定位</li></ul></div>
      <div class="toc-col"><h3 class="toc-chap">第三章 研究方法</h3><ul class="toc-secs"><li>3.1 方法論基礎</li><li>3.2 研究設計</li><li>3.3 建構階段</li><li>3.4 驗證階段</li></ul></div>
      <div class="toc-col"><h3 class="toc-chap">第四章 研究結果</h3><ul class="toc-secs"><li>4.1 建構階段結果<ul style="list-style:none;padding-left:12px;margin-top:2px"><li style="font-size:.9em;opacity:.85">4.1.1 兩位 AI Persona 的差異化表現</li><li style="font-size:.9em;opacity:.85">4.1.2 AI Persona 的穩定性驗證</li><li style="font-size:.9em;opacity:.85">4.1.3 六維度劇本方法論</li></ul></li><li>4.2 驗證階段結果<ul style="list-style:none;padding-left:12px;margin-top:2px"><li style="font-size:.9em;opacity:.85">4.2.1 AI Persona vs. 真人比較結果</li><li style="font-size:.9em;opacity:.85">4.2.2 核心發現：兩種思考模式</li></ul></li></ul></div>
      <div class="toc-col"><h3 class="toc-chap">第五章 討論</h3><ul class="toc-secs"><li>5.1 真人訪談與 AI Persona 優缺點比較</li><li>5.2 如何評估 AI Persona 的好壞</li><li>5.3 對設計研究流程的影響</li><li>5.4 對設計產業與設計師的影響</li><li>5.5 研究者反思</li></ul></div>
      <div class="toc-col"><h3 class="toc-chap">第六章 結論</h3><ul class="toc-secs"><li>6.1 研究結論</li><li>6.2 研究貢獻</li><li>6.3 研究限制</li><li>6.4 未來研究建議</li><li>6.5 總結</li></ul></div>
    </div></section>`,
    // S3 1.1
    `<section class="slide"><div class="kicker">1.1 研究背景</div><h1 class="main">人物誌從 <span class="accent">Cooper 1999</span> 至今 — 靜態限制未解，生成式 AI 帶來新可能。</h1><div class="lead">人物誌是設計研究理解使用者的常見方法，自 Cooper 1999 提出以來即為核心工具。但傳統人物誌長期面臨限制，而生成式 AI 提供了將人物誌從靜態文件轉為可對話主體的可能性。</div><div class="grid2">
      <div class="card"><div class="lbl">傳統人物誌 · 兩項限制</div><p>傳統人物誌一旦建構完成便<b>固定不動</b>，跟不上使用者行為的動態變化；內容也並非使用者原話，而是<b>研究者選取後的敘事</b>。</p><blockquote style="margin-top:8px">「人物誌成為<b>經過整理的敘事</b>，而非使用者的原貌。」</blockquote></div>
      <div class="card" style="border-color:rgba(15,199,123,.5)"><div class="lbl">生成式 AI · 新可能</div><p>生成式 AI 讓人物誌從<b>靜態文件</b>變成<b>可對話主體</b>，但一個根本的問題也隨之出現 — AI 與真人差異的<b>結構性本質</b>究竟為何？</p></div>
    </div></section>`,
    // S4 1.2
    `<section class="slide"><div class="kicker">1.2 研究問題與目的</div><h1 class="main">兩個研究問題 · <span class="accent">建構</span>與<span class="accent">驗證</span>兩階段目標。</h1><div class="lead">本研究目的為探討 AI Persona 與真人受訪者在語言表現上的<b>結構性差異</b>，並釐清 AI Persona 在設計研究流程中的定位。</div><div class="grid2">
      <div class="card"><span class="rq-num">RQ1</span><h3 style="line-height:1.4">如何建構<b style="color:var(--accent)">穩定</b>、可用於研究的 AI Persona？</h3><p>建立一套<b>可操作、可重複</b>的建構流程，使研究者能理解並掌握生成邏輯。</p><p>→ 對應<b>建構階段</b>。</p></div>
      <div class="card"><span class="rq-num">RQ2</span><h3 style="line-height:1.4">AI 與真人在語言表現上有哪些<b style="color:var(--accent)">結構性差異</b>？</h3><p>透過訪談比較，分析兩者在<b>敘事方式、語言特徵、情緒呈現與反思節奏</b>上的差異。</p><p>→ 對應<b>驗證階段</b>。</p></div>
    </div></section>`,
    // S5 1.3
    `<section class="slide"><div class="kicker">1.3 研究範圍與限制</div><h1 class="main">聚焦 <span class="accent">台灣 Z 世代 ETF 投資者</span> · 四項限制。</h1><div class="grid2">
      <div class="card"><div class="lbl">研究範圍</div><p>本研究聚焦於<b>台灣 Z 世代 ETF 投資者</b>，並以 <b>Dcard、PTT</b> 等公開社群資料作為 AI Persona 的語料來源。</p><p style="color:var(--muted);font-style:italic;margin-top:8px">選擇理由於第三章詳述。</p></div>
      <div class="card"><div class="lbl">研究限制 · 四面向</div><p>本研究的限制包括四個面向：<b>測試樣本規模</b>有限（6 位設計師），<b>研究情境</b>僅聚焦 ETF 投資者具特定性，結果受<b>當時 AI 技術條件</b>影響（Gemini 2.5、GPTs），研究者反思屬於<b>設計過程的敘事觀察</b>而非系統性實證資料。</p></div>
    </div></section>`,
    // S6 2.1
    `<section class="slide"><div class="kicker">2.1 人物誌方法論的演進</div><h1 class="main">從 Cooper 到 Salminen — 演進中的<span class="accent">三項系統性限制</span>。</h1><div class="timeline">
      <div class="tl-item"><div class="year">1999</div><h4>Cooper</h4><p>提出人物誌 · 代表使用者群體的虛擬人物模型 · 協助設計師跳脫自我中心</p></div>
      <div class="tl-item"><div class="year">2006</div><h4>Pruitt & Adlin</h4><p>強調人物誌必須奠基於<b>系統性實證資料</b>（田野、訪談、市場數據）</p></div>

    </div><div class="grid3" style="margin-top:12px">
      <div class="card" style="padding:10px 14px"><div class="lbl">限制一</div><h3 style="font-size:14px">靜態特質</h3><p style="font-size:11px">建構完成便固定，難以跟上使用者行為的動態變化</p></div>

    </div><div class="ref">Chapman & Milham (2006); Portigal (2008); Salminen et al. (2018)</div></section>`,
    // S7 2.2
    `<section class="slide"><div class="kicker">2.2 生成式 AI 與角色模擬</div><h1 class="main">LLM 具備角色扮演能力，但<span class="accent">穩定性面臨三項挑戰</span>。</h1><div class="grid3">
      <div class="card"><div class="lbl">角色扮演能力</div><p><b>Shao 2023</b> 的 Character-LLM 透過背景、經歷、情緒訓練模型扮演特定人物；<b>Wang 2024</b> 的 RoleLLM 進一步系統性地評估與提升這類能力。<b>Chen 2024</b> 也指出，角色扮演已成為 LLM 的重要應用領域。</p></div>
      <div class="card"><div class="lbl">三項穩定性挑戰</div><p>穩定性上有三個常見問題：<b>角色漂移</b>是角色特徵在多輪對話中偏離原始設定；<b>前後矛盾</b>是同一角色對相同問題給出不一致回答；<b>脫離設定</b>則是 AI 在特定情境下暴露其模型身份。</p><p style="margin-top:6px;font-size:11px;font-style:italic">Tu 2024 · CharacterEval / Wang 2024 · InCharacter</p></div>
      <div class="card"><div class="lbl">應對策略</div><p>研究者發展出三種策略：<b>系統指令</b>把角色固定在對話框架之外；<b>記憶機制</b>使模型追蹤對話歷史維持一致；<b>劇本約束</b>透過角色規範限定回應範圍。</p><p style="margin-top:6px;font-size:11px;color:var(--warn)">但這些策略只能<b>降低</b>而非消除穩定性問題。</p></div>
    </div></section>`,
    // S8 2.3
    `<section class="slide"><div class="kicker">2.3 AI 在設計流程中的角色</div><h1 class="main">從視覺生成到主動協作者 — 但 <span class="warn" style="color:var(--warn)">Vaccaro 2024</span> 提出警訊。</h1><div class="grid2">
      <div class="card"><div class="lbl">AI 應用的發展</div><p>AI 在設計領域經歷了多個階段：<b>早期</b>集中在視覺生成（圖像、版面、風格轉換）；<b>中期</b>延伸到自然語言處理（文本分析、洞察萃取）；<b>近期</b>生成式 AI 讓 AI 從被動分析工具轉為<b>主動協作者</b>。</p><p style="margin-top:8px;font-size:11px">在使用者研究上，<b>Chopra & Haaland 2023</b> 用 LLM 進行質性訪談，<b>Salminen 2019</b> 自動化生成人物誌，優勢主要在效率提升。</p></div>
      <div class="card" style="border-color:rgba(251,191,36,.4)"><div class="lbl" style="color:var(--warn)">Vaccaro 2024 · 統合分析警訊</div><p>統合超過 <b>100 項</b>人機協作研究：</p><blockquote class="warn" style="margin-top:6px">人機組合<b>平均不如</b>單獨作業中較佳的一方。組合是否帶來增益取決於<b>任務性質與相對能力</b>。</blockquote><p style="margin-top:6px">AI 並非真正的使用者，其回應是<b>模擬而非體驗</b>的產物。</p></div>
    </div></section>`,
    // S9 2.4
    `<section class="slide"><div class="kicker">2.4 小結 · 研究缺口與本研究定位</div><h1 class="main">三項研究缺口 → 本研究採 <span class="accent">差異分析取徑</span>。</h1><div class="grid3">
      <div class="card"><div class="num">缺口一</div><h3>方法論缺口</h3><p>傳統人物誌的靜態限制尚未突破。<b>缺乏建構穩定 AI Persona 的方法論指引</b>。</p></div>
      <div class="card"><div class="num">缺口二</div><h3>差異探討缺口</h3><p>現有研究多聚焦擬真程度，<b>較少探討結構性差異</b>的性質與影響。</p></div>
      <div class="card"><div class="num">缺口三</div><h3>流程定位缺口</h3><p>AI Persona 在設計研究流程中的定位不明 — 是<b>替代品還是互補工具</b>？</p></div>
    </div><blockquote>基於三項缺口，本研究採<b>不同取向</b> — 不探討 AI 與真人的相似程度，而探討<b>結構性差異</b>。</blockquote></section>`,
    // S10 3.1
    `<section class="slide"><div class="kicker">3.1 方法論基礎</div><h1 class="main">採用 <span class="accent">DSR 方法</span> · 選 Z 世代 ETF 投資者為用戶輪廓。</h1><div class="grid2">
      <div class="card"><div class="lbl">Design Science Research</div><p>DSR 源自資訊系統與工程設計領域，核心是<b>透過建構與評估人造物來解決實務問題</b>，並累積可推廣的設計知識。</p><p style="margin-top:8px">本研究與 DSR 有三項契合：核心產出是<b>兩項可驗證的人造物</b>（六維度劇本方法論與兩位 AI Persona）；採<b>建構與驗證兩階段架構</b>對應 Peffers 過程模型；並透過多輪對話、測試、修正的<b>迭代設計循環</b>逐步逼近高品質產出。</p><div class="ref">Hevner et al. (2004); Peffers et al. (2007)</div></div>
      <div class="card"><div class="lbl">用戶輪廓 · Z 世代 ETF 投資者</div><p>選擇這個情境的理由是<b>明顯的情緒與行為連動性</b>。相較其他投資族群，Z 世代更容易受到<b>短期市場波動與社群輿論</b>影響，決策語言充滿<b>猶豫、焦慮、自我質疑</b>。</p><p style="margin-top:8px">ETF 本質是理性長線策略，但 Z 世代同時暴露於即時資訊、價格波動與情緒刺激，形成理性長線與感性短線之間的張力，讓<b>反思機制</b>成為必然出現的心理過程與觀察素材。</p></div>
    </div></section>`,
    // S11 3.2
    `<section class="slide"><div class="kicker">3.2 研究設計</div><h1 class="main">建構 + 驗證 · <span class="accent">兩階段架構</span>。</h1><div class="lead">為達成研究目的，本研究採兩階段進行 — 先建構 AI Persona，再評估其品質。整體研究架構如論文<b>圖 3-1</b> 所示。</div><div class="grid2">
      <div class="card" style="border-color:rgba(15,199,123,.5)"><div class="lbl">建構階段</div><h3>透過人機共構 · 建立敘事穩定的 AI Persona</h3><p>整體流程涵蓋建構工具選擇、次級資料蒐集、社群語料蒐集、六維度劇本生成、AI Persona 部署與建構成果。</p><p>產出<b>兩位對比 AI Persona</b>（Anne / Emily）。</p></div>
      <div class="card" style="border-color:rgba(251,191,36,.4)"><div class="lbl">驗證階段 · 兩部分</div><p>驗證階段分為兩部分。第一部分是<b>劇本方法論驗證</b>（3.4.1）— 邀請 6 位設計師從穩定性、差異性、感知品質三面向評估 AI Persona。</p><p style="margin-top:6px">第二部分是<b>AI 與真人比較</b>（3.4.2）— 透過模擬驗證訪談，將 AI Anne 與 2 位真人受訪者的回應以六項語言維度進行編碼分析。</p></div>
    </div></section>`,
    // S12 3.3
    `<section class="slide"><div class="kicker">3.3 建構階段</div><h1 class="main">四階段流程 → 六維度劇本 → <span class="accent">Anne / Emily</span>。</h1><div class="grid4">

    `<section class="slide"><div class="kicker">3.4 驗證階段</div><h1 class="main">兩項評估 · <span class="accent">6 位設計師</span> + <span class="accent">3 位受訪者</span>。</h1><div class="grid2">

    `<section class="slide"><div class="kicker">4.1 建構階段結果</div><h1 class="main">三項結果都通過 — <span class="accent">差異化</span>、<span class="accent">穩定性</span>、<span class="accent">感知品質</span>。</h1><div class="lead">建構階段的結果由三個面向驗證：兩位 AI Persona 的差異化表現、AI Persona 的穩定性驗證，以及六維度劇本方法論的整體感知品質。</div><div class="grid3">

    `<section class="slide"><div class="kicker">4.2 驗證階段結果</div><h1 class="main">AI <span class="accent">+43%</span> 結構性 · <span class="warn" style="color:var(--warn)">−79%</span> 真實性 → <span class="accent">兩種思考模式</span>。</h1><div class="lead">驗證階段的結果由兩項發現構成：AI 與真人在六項語言維度上的比較結果，以及基於此差異提出的核心概念貢獻——兩種思考模式的區分。</div><div class="grid2">

    `<section class="slide"><div class="kicker">5.2 如何評估 AI Persona 的好壞</div><h1 class="main">既有七取徑各有限制 → 本研究提出 <span class="accent">三層次評估架構</span>。</h1><div class="lead">人物誌評估文獻現有七條取徑（量表、過程、實務、擬真、任務、看分數、透明），共同缺口是<b>較少直接評估 AI Persona 進入研究流程後是否適用</b>。</div><div class="grid3">

      <div class="card" style="border-color:rgba(15,199,123,.5)"><div class="num">Layer 3</div><h3>互動品質</h3><p><b>本研究新增</b> · 檢驗<b>穩定性</b>與<b>差異性</b>。</p></div>
    </div><blockquote>三層由<b>建構 → 感知 → 互動</b>，補上既有取徑最欠缺的「<b>使用情境</b>」面向。</blockquote><blockquote class="warn">架構限制：評估門檻尚未建立 · 樣本 N=6 有限 · 未延伸到設計產出品質。</blockquote></section>`,
    // S19 5.3
    `<section class="slide"><div class="kicker">5.3 對設計研究流程的影響</div><h1 class="main">三項影響 — <span class="accent">階段配置</span>、<span class="accent">視角轉變</span>、<span class="accent">效率深度平衡</span>。</h1><div class="grid3">

    // S21 5.5

    // S22 6.1
    `<section class="slide"><div class="kicker">6.1 研究結論</div><h1 class="main">三項研究結論。</h1><div class="grid3">

    </div></section>`,
    // S23 6.2
    `<section class="slide"><div class="kicker">6.2 研究貢獻</div><h1 class="main">理論貢獻 + 實務貢獻 · <span class="accent">各三項</span>。</h1><div class="grid2">
      <div class="card" style="border-color:rgba(15,199,123,.5)"><div class="lbl">理論貢獻</div><p>本研究首先提出<b>六維度劇本方法論</b>，將 Park 2023 生成式代理概念系統化為六個可操作維度並實證驗證。</p><p style="margin-top:6px"><b>兩種思考模式框架</b>——合成式 vs 經歷中——為理解 AI 與人類認知差異提供新概念視角。</p><p style="margin-top:6px">最後<b>重新定義不完美的價值</b>：停頓、矛盾、情緒是認知訊號而非雜訊。</p></div>
      <div class="card"><div class="lbl">實務貢獻</div><p>提供<b>新的設計研究工具</b>——六維度劇本可用於前期探索與概念測試，提升效率。</p><p style="margin-top:6px">為業界提供<b>人機協作模式參考</b>：「AI 廣度 + 真人深度」的協作定位。</p><p style="margin-top:6px">研究者從「AI 不夠像人」到「太像理想人」的歷程，提供設計師具體<b>實務指引</b>。</p></div>
    </div></section>`,

      <div class="card"><div class="num" style="font-size:18px">②</div><h3 style="font-size:13px">情境特定性</h3><p style="font-size:11px">僅聚焦 Z 世代 ETF 投資者 · 方法論推廣需驗證</p></div>
      <div class="card"><div class="num" style="font-size:18px">③</div><h3 style="font-size:13px">模型時效性</h3><p style="font-size:11px">Gemini 2.5 + GPTs · 結果為<b>特定技術條件</b>下的產出</p></div>
      <div class="card"><div class="num" style="font-size:18px">④</div><h3 style="font-size:13px">反思屬敘事</h3><p style="font-size:11px">研究者反思是<b>敘事觀察</b>而非系統性實證資料</p></div>
    </div></section>`,
    // S25 6.4
    `<section class="slide"><div class="kicker">6.4 未來研究建議</div><h1 class="main">三項未來研究方向。</h1><div class="grid3">
      <div class="card"><div class="num">建議 ①</div><h3>擴大應用情境</h3><p>將六維度方法論應用到不同使用者類型，例如<b>醫療、法律</b>等知識密集領域，或<b>悲傷輔導、親密關係</b>等情緒密集情境，測試方法論的可推廣性。</p></div>

      <div class="card"><div class="num">建議 ③</div><h3>訪談以外的應用</h3><p>AI Persona 也可以扮演其他角色，例如<b>工作坊參與者</b>、<b>原型測試模擬使用者</b>、或<b>團隊溝通中傳遞使用者需求</b>的代表。</p></div>
    </div></section>`,

    `<section class="slide"><div class="kicker">6.5 總結</div><h1 class="main big"><span class="accent">不能取代</span> · <span class="accent">不必取代</span> · 走向互補協作。</h1><div class="grid2">
      <div class="card"><div class="lbl">為什麼不能取代</div><p>兩者本質上是<b>不同的思考模式</b>。AI 的合成式思考缺乏真人思考的<b>時間性、不確定性、情緒滲透</b>。無法呈現認知建構過程，只能呈現完成後的結果。真人訪談中的<b>意外洞察、情感連結</b>是 AI 無法提供的。</p></div>

    `<section class="slide"><div class="thanks"><h1>謝謝聆聽</h1><div class="p">歡迎提問</div></div></section>`

  function fmtScript(str){
    return str.split('\n\n').map(p=>
      '<p>'+p.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>'
    ).join('');
  }

  const itemsEl=document.getElementById('items');
  const tocBar=document.getElementById('toc-bar');
  S.forEach((s,idx)=>{
    const anchor='s'+s.no;
    const item=document.createElement('div');
    item.className='item';item.id=anchor;
    item.innerHTML=`
      <div class="item-head">
        <span class="no">S${s.no}</span>
        <h2>${s.title}</h2>
        <span class="sec">建議 <b>${s.sec}″</b></span>
      </div>
      <div class="slide-wrap">
        <div class="frame">
          <div class="slide-inner">${SLIDES[idx]||''}</div>
        </div>
      </div>
      <div class="script-wrap">
        <div class="script-body">${fmtScript(s.body)}</div>
        ${s.cue?`<div class="cue"><b>控場</b>${s.cue}</div>`:''}
      </div>
    `;
    itemsEl.appendChild(item);
    const link=document.createElement('a');
    link.href='#'+anchor;link.textContent='S'+s.no;
    tocBar.appendChild(link);
  });

  const frames=document.querySelectorAll('.frame');
  function scaleAll(){
    frames.forEach(f=>{
      const inner=f.querySelector('.slide-inner');
      const w=f.getBoundingClientRect().width;
      inner.style.transform=`scale(${w/1280})`;
    });
  }
  scaleAll();
  window.addEventListener('resize',scaleAll);
  new ResizeObserver(scaleAll).observe(document.body);
</script>
