<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>對照檢查 · 中文簡報 + 講稿</title>
<style>
  :root{
    --bg:#0a0e0b;--card:#141a15;--line:rgba(15,199,123,.22);--accent:#0FC77B;
    --ink:#f1f3f2;--muted:#aab3ac;--warn:#fbbf24;--warn-bg:rgba(251,191,36,.1)
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Inter',-apple-system,sans-serif;line-height:1.65}
  .wrap{max-width:1520px;margin:0 auto;padding:44px 32px 120px}
  header{border-bottom:2px solid var(--accent);padding-bottom:20px;margin-bottom:36px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px}
  header .l .kicker{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:10px}
  header .l h1{font-size:26px;font-weight:800;line-height:1.3;margin-bottom:8px}
  header .l h1 .accent{color:var(--accent)}
  header .l .meta{color:var(--muted);font-size:13px;line-height:1.6}
  header .l .meta b{color:var(--ink)}
  header .r{display:flex;gap:14px;flex-wrap:wrap}
  header .r a{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 14px;font-size:13px;text-decoration:none;border-radius:6px;transition:.2s}
  header .r a:hover{background:var(--accent);color:#04121a;border-color:var(--accent)}

  .item{display:grid;grid-template-columns:1.9fr 1fr;gap:24px;margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid rgba(15,199,123,.1)}
  .item-head{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .item-head .no{background:var(--accent);color:#04121a;font-weight:800;font-size:12px;letter-spacing:.1em;padding:4px 10px;border-radius:5px;font-family:'Consolas','SF Mono',monospace}
  .item-head h2{font-size:17px;font-weight:700;color:var(--ink);flex:1}
  .item-head .sec{font-family:'Consolas','SF Mono',monospace;color:var(--muted);font-size:13px}
  .item-head .sec b{color:var(--accent)}

  .frame{position:relative;width:100%;aspect-ratio:16/9;border:1.6px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
  .slide-inner{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left}
  .slide-inner .slide{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column;justify-content:center;opacity:1!important;padding:48px 72px;overflow:hidden;
    background-image:
      linear-gradient(rgba(15,199,123,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(15,199,123,.025) 1px,transparent 1px),
      radial-gradient(1000px 700px at 15% 0%,rgba(15,199,123,.06),transparent 60%);
    background-size:64px 64px,64px 64px,100% 100%;background-repeat:repeat,repeat,no-repeat}
  .slide-inner .slide::after{content:'';position:absolute;bottom:0;left:0;right:0;height:10px;background:var(--accent)}

  .slide-inner .kicker{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px}
  .slide-inner h1.main{font-size:30px;font-weight:800;line-height:1.28;letter-spacing:-.01em;margin-bottom:16px;color:var(--ink)}
  .slide-inner h1.main .accent{color:var(--accent)}
  .slide-inner h1.main.big{font-size:38px}
  .slide-inner .lead{color:var(--muted);font-size:15px;line-height:1.65;margin-bottom:16px;max-width:88ch}
  .slide-inner .lead b{color:var(--ink);font-weight:600}
  .slide-inner .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  .slide-inner .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
  .slide-inner .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:12px}
  .slide-inner .card{background:var(--card);border:1.6px solid var(--line);border-radius:12px;padding:14px 18px}
  .slide-inner .card .lbl{color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
  .slide-inner .card h3{color:var(--ink);font-size:16px;font-weight:700;line-height:1.35;margin-bottom:8px}
  .slide-inner .card p{color:var(--muted);font-size:13px;line-height:1.6}
  .slide-inner .card p b{color:var(--ink);font-weight:600}
  .slide-inner .card p + p{margin-top:6px}
  .slide-inner .card .num{color:var(--accent);font-size:24px;font-weight:800;line-height:1;margin-bottom:4px}
  .slide-inner .card .num small{color:var(--muted);font-size:12px;font-weight:500;display:block;margin-top:4px}
  .slide-inner .list{margin:8px 0 0;padding:0;list-style:none}
  .slide-inner .list li{position:relative;padding:4px 0 4px 16px;color:var(--muted);font-size:13px;line-height:1.5}
  .slide-inner .list li::before{content:'';position:absolute;left:0;top:12px;width:5px;height:5px;background:var(--accent);border-radius:50%}
  .slide-inner .list li b{color:var(--ink);font-weight:600}
  .slide-inner blockquote{background:rgba(15,199,123,.06);border-left:4px solid var(--accent);padding:10px 16px;border-radius:0 10px 10px 0;color:var(--ink);font-size:14px;line-height:1.55;margin:12px 0;font-style:italic}
  .slide-inner blockquote.warn{background:var(--warn-bg);border-left-color:var(--warn)}
  .slide-inner blockquote b{color:var(--accent);font-style:normal}
  .slide-inner blockquote.warn b{color:var(--warn)}
  .slide-inner .ref{color:var(--muted);font-size:11px;opacity:.7;margin-top:12px;font-style:italic}
  .slide-inner .rq-num{display:inline-block;background:var(--accent);color:#04121a;font-weight:800;padding:4px 10px;border-radius:5px;font-size:12px;letter-spacing:.05em;margin-bottom:6px}
  .slide-inner .stat-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}
  .slide-inner .stat{flex:1;min-width:80px}
  .slide-inner .stat .v{color:var(--accent);font-size:30px;font-weight:800;line-height:1}
  .slide-inner .stat .v.warn{color:var(--warn)}
  .slide-inner .stat .k{color:var(--muted);font-size:12px;margin-top:4px}
  .slide-inner .stat .k b{color:var(--ink)}
  .slide-inner table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
  .slide-inner th,.slide-inner td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
  .slide-inner th{color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(15,199,123,.08)}
  .slide-inner td.muted{color:var(--muted);font-size:12px}
  .slide-inner .contrast{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-top:12px}
  .slide-inner .contrast .side{background:var(--card);border:1.6px solid var(--line);border-radius:12px;padding:16px}
  .slide-inner .contrast .side.ai{border-color:rgba(15,199,123,.4)}
  .slide-inner .contrast .side.hu{border-color:rgba(251,191,36,.4)}
  .slide-inner .contrast .side .lbl{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
  .slide-inner .contrast .side.ai .lbl{color:var(--accent)}
  .slide-inner .contrast .side.hu .lbl{color:var(--warn)}
  .slide-inner .contrast .side h4{color:var(--ink);font-size:18px;font-weight:700;margin-bottom:8px;line-height:1.3}
  .slide-inner .contrast .side p{color:var(--muted);font-size:13px;line-height:1.55}
  .slide-inner .contrast .side p + p{margin-top:6px}
  .slide-inner .contrast .side p b{color:var(--ink)}
  .slide-inner .contrast .vs{color:var(--muted);font-weight:800;font-size:14px;display:flex;align-items:center}
  .slide-inner .quote-box{background:rgba(255,255,255,.03);border:1px dashed rgba(15,199,123,.2);border-radius:8px;padding:10px 14px;margin-top:8px;color:var(--ink);font-size:12px;font-style:italic;line-height:1.5}
  .slide-inner .quote-box b{color:var(--accent);font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
  .slide-inner .thanks{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px}
  .slide-inner .thanks h1{font-size:72px;color:var(--accent);font-weight:800;letter-spacing:.05em}
  .slide-inner .thanks .p{color:var(--muted);font-size:22px}
  .slide-inner .cover{padding:64px 96px}
  .slide-inner .cover .badge{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:16px;padding:5px 12px;border:1.5px solid var(--accent);border-radius:5px;display:inline-block;width:fit-content}
  .slide-inner .cover h1{font-size:52px;font-weight:800;line-height:1.15;margin-bottom:14px;letter-spacing:-.01em}
  .slide-inner .cover h1 .accent{color:var(--accent)}
  .slide-inner .cover .subtitle{color:var(--muted);font-size:20px;line-height:1.4;margin-bottom:22px;max-width:60ch}
  .slide-inner .cover .abs{color:var(--ink);font-size:15px;line-height:1.65;max-width:75ch;margin-bottom:28px}
  .slide-inner .cover .abs b{color:var(--accent)}
  .slide-inner .cover .meta{color:var(--muted);font-size:15px;line-height:1.8}
  .slide-inner .cover .meta b{color:var(--ink)}
  /* TOC in preview */
  .slide-inner .toc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 22px;margin-top:12px}
  .slide-inner .toc-col h3.toc-chap{color:var(--accent);font-size:14px;font-weight:800;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(15,199,123,.25)}
  .slide-inner .toc-secs{list-style:none;padding:0;margin:0}
  .slide-inner .toc-secs > li{color:var(--muted);font-size:11px;line-height:1.6;padding:1px 0}
  .slide-inner .toc-secs > li ul{list-style:none;padding-left:12px;margin-top:2px}
  .slide-inner .toc-secs > li ul li{font-size:10px;color:var(--muted);opacity:.8}

  .script-wrap{display:flex;flex-direction:column;gap:12px}
  .script-body{color:var(--ink);font-size:14px;line-height:1.8;letter-spacing:.02em;background:var(--card);border:1.6px solid var(--line);border-radius:10px;padding:16px 18px;flex:1}
  .script-body p{margin-bottom:10px}
  .script-body p:last-child{margin-bottom:0}
  .script-body b{color:var(--accent);font-weight:600}
  .cue{background:rgba(251,191,36,.08);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 8px 8px 0;color:var(--warn);font-size:12px;line-height:1.5}
  .cue b{color:var(--warn);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10px;display:block;margin-bottom:3px}

  .toc-bar{position:sticky;top:0;background:rgba(10,14,11,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 32px;margin:0 -32px 24px;z-index:10;display:flex;gap:4px;overflow-x:auto}
  .toc-bar a{color:var(--muted);text-decoration:none;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;font-family:'Consolas','SF Mono',monospace;transition:.15s}
  .toc-bar a:hover{background:var(--accent);color:#04121a}

  @media (max-width:1000px){
    .item{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff;color:#000}
    .toc-bar,header .r{display:none}
    .item{break-inside:avoid;grid-template-columns:1fr 1fr}
    .script-body{background:#fff;color:#000;border-color:#ccc}
    .script-body b{color:#0a7548}
    .cue{background:#fff8e0;color:#875f00}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="l">
    <div class="kicker">對照檢查頁 · Review</div>
    <h1><span class="accent">AI Persona</span> 論文口試 · 簡報 + 講稿</h1>
    <div class="meta"><b>簡潔安</b>　20 頁 · 20 分鐘 · 對齊論文六章結構</div>
  </div>
  <div class="r">
    <a href="thesis-zh.html">▶ 開簡報</a>
    <a href="thesis-zh-presenter.html">📖 Presenter</a>
    <a href="thesis-zh-script.html">📄 純講稿</a>
  </div>
</header>

<div class="toc-bar" id="toc-bar"></div>

<div id="items"></div>

</div>

<script src="thesis-zh-scripts.js"></script>
<script>
  const S=window.THESIS_ZH_SCRIPTS;

  const SLIDES=[
    // S1 · 封面
    `<section class="slide cover">
      <div class="badge">碩士論文口試</div>
      <h1>AI Persona 能取代<br><span class="accent">真人訪談</span>嗎？</h1>
      <div class="subtitle">探討 AI Persona 與真人受訪者的差異對設計研究的影響</div>
      <div class="abs">本研究不探討 AI Persona 與真人的<b>相似程度</b>，而探討兩者之間的<b>結構性差異</b>，以及此差異對設計研究的意涵。透過設計科學研究方法、六維度劇本方法論的建構，並與真人受訪者進行系統性比較，我們主張 AI Persona 的價值不在模擬真人，而在作為對照基準。</div>
      <div class="meta"><b>簡潔安</b>　指導教授：<b>唐玄輝 博士</b><br>國立臺灣科技大學　設計系碩士班　學號：M11110914</div>
    </section>`,
    // S2 · 目錄
    `<section class="slide">
      <div class="kicker">目錄</div>
      <h1 class="main">論文架構 · <span class="accent">六章</span></h1>
      <div class="toc-grid">
        <div class="toc-col"><h3 class="toc-chap">第一章 緒論</h3><ul class="toc-secs"><li>1.1 研究背景</li><li>1.2 研究問題</li><li>1.3 研究目的</li><li>1.4 研究範圍與限制</li><li>1.5 研究流程與架構</li></ul></div>
        <div class="toc-col"><h3 class="toc-chap">第二章 文獻探討</h3><ul class="toc-secs"><li>2.1 Persona 方法論的演進與 AI 時代的挑戰</li><li>2.2 生成式 AI 與動態人物誌：從敘事生成到行為展演</li></ul></div>
        <div class="toc-col"><h3 class="toc-chap">第三章 研究方法</h3><ul class="toc-secs"><li>3.1 方法論基礎</li><li>3.2 研究設計</li><li>3.3 建構階段</li><li>3.4 驗證階段</li></ul></div>
        <div class="toc-col"><h3 class="toc-chap">第四章 研究結果</h3><ul class="toc-secs"><li>4.1 建構階段結果<ul><li>4.1.1 兩位 AI Persona 的差異化表現</li><li>4.1.2 AI Persona 的穩定性驗證</li><li>4.1.3 六維度劇本方法論</li></ul></li><li>4.2 驗證階段結果<ul><li>4.2.1 AI Persona vs. 真人比較結果</li><li>4.2.2 核心發現：兩種思考模式</li></ul></li></ul></div>
        <div class="toc-col"><h3 class="toc-chap">第五章 討論</h3><ul class="toc-secs"><li>5.1 真人訪談與 AI Persona 的優缺點比較</li><li>5.2 對設計研究流程的影響</li><li>5.3 對設計產業與設計師的影響</li></ul></div>
        <div class="toc-col"><h3 class="toc-chap">第六章 結論與建議</h3><ul class="toc-secs"><li>6.1 研究結論</li><li>6.2 研究貢獻</li><li>6.3 研究限制</li><li>6.4 未來研究建議</li><li>6.5 總結</li></ul></div>
      </div>
    </section>`,
    // S3 · 第一章 · 研究問題 · 研究目的
    `<section class="slide">
      <div class="kicker">第一章 · 1.2 研究問題 · 1.3 研究目的</div>
      <h1 class="main">當 AI 進入研究流程，<span class="accent">兩個核心問題</span>浮現：</h1>
      <div class="lead">本研究目的為探討 AI Persona 與真人受訪者在語言表現上的<b>結構性差異</b>，以及這些差異對設計研究的影響，並據此釐清 AI Persona 在設計研究流程中的定位。研究包含兩個階段性目標：<b>建構</b>與<b>驗證</b>。</div>
      <div class="grid2">
        <div class="card"><span class="rq-num">RQ1</span><h3 style="line-height:1.4">如何建構<b style="color:var(--accent)">穩定</b>、可用於研究的 AI Persona？</h3><p>建立一套<b>可操作、可重複</b>的 AI Persona 建構流程，使研究者能理解並掌握生成邏輯，系統性地設定角色的背景與語氣，而非被動接受模型的輸出。</p><p>→ 對應本研究的<b>建構階段</b>。</p></div>
        <div class="card"><span class="rq-num">RQ2</span><h3 style="line-height:1.4">AI 與真人受訪者在語言表現上有哪些<b style="color:var(--accent)">結構性差異</b>？</h3><p>透過真人受訪者與 AI Persona 的訪談比較，分析兩者在<b>敘事方式、語言特徵、情緒呈現與反思節奏</b>上的差異。</p><p>→ 對應本研究的<b>驗證階段</b>。</p></div>
      </div>
    </section>`,
    // S4 · 第二章 · 2.1
    `<section class="slide">
      <div class="kicker">第二章 · 2.1 Persona 方法論的演進與 AI 時代的挑戰</div>
      <h1 class="main">自 Cooper（1999）以來，人物誌已成為設計研究中代表使用者的核心方法，但長期面臨<span class="accent">兩項根本限制</span>。</h1>
      <div class="lead">Salminen 等（2018）系統性彙整了人物誌的既有批評，Chapman 與 Milham（2006）指出人物誌方法缺乏從資料到人物誌的可靠程序。綜合文獻，本研究歸納出與研究方向最相關的<b>兩項限制</b>：</div>
      <div class="grid2">
        <div class="card"><div class="lbl">限制一 · 靜態特質</div><h3>建構完成便固定下來</h3><p>真實使用者的行為與態度會隨情境變化、社群互動、資訊更新、情緒波動<b>持續改變</b>。人物誌卻難以跟上這種隨時間推移的變化，靜態的描述無法捕捉這種時間性。</p><p>Portigal（2008）批評：人物誌的吸引力正來自對現實的簡化，使用者資料被持續縮減與抽象化，最終可能<b>淪為刻板印象</b>。</p></div>
        <div class="card"><div class="lbl">限制二 · 詮釋依賴</div><h3>研究者的主觀決策充斥其中</h3><p>人物誌的內容並非直接來自使用者，而是研究者選取資料、保留語氣、強調特徵之後的<b>產物</b>。從資料的選取、語氣的保留、到特徵的強調，皆涉及研究者的主觀決策。</p><p>此外，人物誌經常消除真實使用者語言中常見的<b>矛盾、猶豫、跳躍與中斷</b>等非線性特質 — 而這些不完美的語言特徵可能正是理解使用者認知歷程的重要線索。</p></div>
      </div>
      <div class="ref">Cooper (1999); Chapman & Milham (2006); Portigal (2008); Salminen et al. (2018)</div>
    </section>`,
    // S5 · 第二章 · 2.2
    `<section class="slide">
      <div class="kicker">第二章 · 2.2 生成式 AI 與動態人物誌 · 從敘事生成到行為展演</div>
      <h1 class="main">生成式 AI 讓人物誌從「被閱讀的文件」變成「<span class="accent">可對話的主體</span>」— 但差異的本質尚未被探討。</h1>

    // S16 · 第五章 · 5.1
    `<section class="slide">

    // S18 · 第五章 · 5.3
    `<section class="slide">

    `<section class="slide">

  function fmtScript(str){
    return str.split('\n\n').map(p=>
      '<p>'+p.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>'
    ).join('');
  }

  const itemsEl=document.getElementById('items');
  const tocBar=document.getElementById('toc-bar');
  S.forEach((s,idx)=>{

    item.className='item';item.id=anchor;
    item.innerHTML=`
      <div class="item-head">
        <span class="no">S${s.no}</span>
        <h2>${s.title}</h2>
        <span class="sec">建議 <b>${s.sec}″</b></span>

      </div>
    `;
    itemsEl.appendChild(item);
    const link=document.createElement('a');
    link.href='#'+anchor;link.textContent='S'+s.no;

  });

  const frames=document.querySelectorAll('.frame');
  function scaleAll(){
    frames.forEach(f=>{

    });
