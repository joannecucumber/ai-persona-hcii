<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCII 講稿 × 生字 · Script & Vocabulary</title>
<style>
  :root{--bg:#0a0e0b;--card:#141a15;--line:rgba(15,199,123,.22);--accent:#0FC77B;--ink:#f1f3f2;--muted:#aab3ac;--hl:rgba(15,199,123,.28)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter','PingFang TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55;padding:32px 24px 80px;max-width:1200px;margin:0 auto}
  header{border-bottom:1.5px solid var(--line);padding-bottom:18px;margin-bottom:20px}
  h1{color:var(--ink);font-size:26px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
  h1 .accent{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 8px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:10;border-bottom:1px solid rgba(15,199,123,.1)}
  #q{flex:1;min-width:200px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:15px;outline:none}
  #q:focus{border-color:var(--accent)}
  .count{color:var(--muted);font-size:13px}
  .btn{background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.on{background:var(--accent);color:#04121a;border-color:var(--accent);font-weight:700}
  section.slide{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;transition:.15s}
  section.slide.hidden{display:none}
  .slide-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(15,199,123,.12);flex-wrap:wrap}
  .slide-num{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  .slide-ttl{color:var(--ink);font-size:18px;font-weight:700}
  .slide-time{color:var(--muted);font-size:12px;font-family:'Consolas','SF Mono',monospace}
  .slide-body{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
  @media (max-width:820px){.slide-body{grid-template-columns:1fr}}
  .script .lang{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
  .script .en{color:var(--ink);font-size:15.5px;line-height:1.7;margin-bottom:14px}
  .script .zh{color:var(--muted);font-size:14px;line-height:1.9}
  mark.hl{background:var(--hl);color:var(--ink);padding:1px 3px;border-radius:3px;font-weight:600;cursor:pointer;border-bottom:1.5px solid var(--accent);transition:.1s}
  mark.hl:hover{background:var(--accent);color:#04121a}
  .vocab-col .vlabel{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .vocab-col .vlabel .cnt{background:rgba(15,199,123,.16);color:var(--accent);font-size:10px;padding:2px 6px;border-radius:4px}
  .vlist{display:flex;flex-direction:column;gap:6px}
  .vrow{background:rgba(0,0,0,.24);border:1px solid rgba(15,199,123,.14);border-radius:8px;padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;transition:.15s}
  .vrow:hover{border-color:var(--accent)}
  .vrow .w{min-width:0}
  .vrow .en{color:var(--ink);font-size:14px;font-weight:700;letter-spacing:-.01em}
  .vrow .kk{color:var(--accent);font-size:11.5px;font-family:'Consolas','SF Mono',monospace;letter-spacing:.02em;margin-top:1px}
  .vrow .zh{color:var(--muted);font-size:11.5px;margin-top:2px}
  .vrow .zh b{color:#cbd5cc;font-weight:600}
  .play{width:32px;height:32px;border-radius:50%;background:transparent;border:1.3px solid var(--line);color:var(--accent);font-size:11px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .play:hover{background:var(--accent);color:#04121a;border-color:var(--accent)}
  .play.playing{background:var(--accent);color:#04121a;border-color:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  /* Mastery state on slide card */
  section.slide.m-weak{border-left:5px solid #f66}
  section.slide.m-medium{border-left:5px solid #fbbf24}
  section.slide.m-good{border-left:5px solid var(--accent)}
  .mastery-btns{display:flex;gap:5px;margin-left:8px}
  .mbtn{background:transparent;border:1.5px solid rgba(255,255,255,.16);color:var(--muted);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;cursor:pointer;transition:.12s;white-space:nowrap;line-height:1}
  .mbtn:hover{border-color:var(--accent);color:var(--ink)}
  .mbtn[data-lvl="weak"].on{background:rgba(246,102,102,.16);border-color:#f66;color:#f66}
  .mbtn[data-lvl="medium"].on{background:rgba(251,191,36,.16);border-color:#fbbf24;color:#fbbf24}
  .mbtn[data-lvl="good"].on{background:rgba(15,199,123,.16);border-color:var(--accent);color:var(--accent)}
  /* Star button on vocab row */
  .star{width:26px;height:26px;background:transparent;border:none;font-size:16px;color:rgba(255,255,255,.28);cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
  .star:hover{transform:scale(1.15);color:#fbbf24}
  .star.on{color:#fbbf24;text-shadow:0 0 8px rgba(251,191,36,.4)}
  .vrow.starred{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.35)}
  .vrow{grid-template-columns:1fr auto auto}
  .vrow>.play{margin-left:4px}
  /* Filter chips */
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-left:8px}
  .filters .chip{background:var(--card);border:1.3px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:20px;cursor:pointer;transition:.12s;font-size:12px;font-weight:600;white-space:nowrap}
  .filters .chip:hover{border-color:var(--accent)}
  .filters .chip.on{background:var(--accent);color:#04121a;border-color:var(--accent)}
  .stats{color:var(--muted);font-size:12px;margin-left:auto;padding:6px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
  .stats b{color:var(--ink)}
  /* Hidden when filter mismatches */
  .vrow.hide-by-star{display:none}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:60px;padding-top:20px;border-top:1px solid var(--line)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  @media (max-width:600px){body{padding:20px 14px 60px}h1{font-size:20px}.script .en{font-size:14.5px}.slide-ttl{font-size:16px}}
</style>

let RATE = 0.85;
let SCRIPT_ONLY = false;
let FILTER_STAR = false;
let FILTER_WEAK = false;

// ===== Persistence =====
const STATE_KEY = 'hcii-vocab-state-v1';
function loadState(){
  try{ return JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveState(){
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }
  catch(e){}
}
const STATE = Object.assign({mastery:{}, starred:{}}, loadState());
STATE.mastery = STATE.mastery || {};
STATE.starred = STATE.starred || {};

function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escapeAttr(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

// Highlight vocab words in script (case-insensitive, handles common inflections)
function highlight(script, words){
  if(!words || words.length===0) return escapeHTML(script);
  const matches = [];
  words.forEach(base => {
    if(!VOCAB[base]) return;
    const esc = base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // multi-word vocab: exact match only. single-word: allow -s/-es/-ed/-ing suffix
    const pattern = base.includes(' ')
      ? new RegExp('\\b(' + esc + ')\\b', 'gi')
      : new RegExp('\\b(' + esc + '(?:s|es|ed|ing)?)\\b', 'gi');
    let m;
    while((m = pattern.exec(script)) !== null){
      matches.push({start:m.index, end:m.index+m[0].length, base, matched:m[0]});
    }
  });
  // sort by start, then longer wins
  matches.sort((a,b)=> a.start-b.start || (b.end-b.start)-(a.end-a.start));
  // remove overlaps
  const cleaned = [];
  let lastEnd = -1;
  matches.forEach(m => {
    if(m.start >= lastEnd){ cleaned.push(m); lastEnd = m.end; }
  });
  // build HTML
  let html = '', pos = 0;
  cleaned.forEach(m => {
    html += escapeHTML(script.substring(pos, m.start));
    const v = VOCAB[m.base];
    const zhPlain = v.zh.replace(/<[^>]+>/g,'');
    html += `<mark class="hl" data-word="${escapeAttr(m.base)}" title="${escapeAttr(m.base+' /'+v.kk+'/ '+zhPlain)}">${escapeHTML(m.matched)}</mark>`;
    pos = m.end;
  });
  html += escapeHTML(script.substring(pos));
  return html;
}

function renderAll(){
  const container = document.getElementById('content');
  container.innerHTML = '';
  let totalVocab = 0;
  SLIDES.forEach(s => {
    totalVocab += s.words.length;
    const sec = document.createElement('section');
    sec.className = 'slide';
    // Restore mastery class
    const lvl = STATE.mastery[s.n];
    if(lvl) sec.classList.add('m-' + lvl);
    sec.dataset.slideN = s.n;
    sec.dataset.search = (s.t + ' ' + s.en + ' ' + s.zh + ' ' + s.words.join(' ')).toLowerCase();
    const scriptHTML = highlight(s.en, s.words);
    const vocabHTML = s.words.map(base => {
      if(!VOCAB[base]) return '';
      const v = VOCAB[base];
      const starred = !!STATE.starred[base];
      return `<div class="vrow${starred?' starred':''}" data-word-key="${escapeAttr(base)}">
        <div class="w">
          <div class="en">${escapeHTML(base)}</div>
          <div class="kk">/ ${v.kk} /</div>
          <div class="zh">${v.zh}</div>
        </div>
        <button class="star${starred?' on':''}" data-word="${escapeAttr(base)}" title="標星 / 取消星號">${starred?'★':'☆'}</button>
        <button class="play" data-word="${escapeAttr(base)}" title="播放">▶</button>
      </div>`;
    }).join('');
    const masteryBtns = `<div class="mastery-btns">
        <button class="mbtn${lvl==='weak'?' on':''}" data-lvl="weak" data-slide="${s.n}">🔴 不熟</button>
        <button class="mbtn${lvl==='medium'?' on':''}" data-lvl="medium" data-slide="${s.n}">🟡 普通</button>
        <button class="mbtn${lvl==='good'?' on':''}" data-lvl="good" data-slide="${s.n}">🟢 熟悉</button>
      </div>`;
    sec.innerHTML = `
      <div class="slide-head">
        <div>
          <div class="slide-num">Slide ${s.n}</div>
          <div class="slide-ttl">${escapeHTML(s.t)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          ${masteryBtns}
          <div class="slide-time">⏱ ${s.time}</div>
        </div>
      </div>
      <div class="slide-body">
        <div class="script">
          <div class="lang">🇺🇸 English</div>
          <div class="en">${scriptHTML}</div>
          <div class="lang">🇹🇼 中文</div>
          <div class="zh">${escapeHTML(s.zh)}</div>
        </div>
        <div class="vocab-col">
          <div class="vlabel">Vocab in this slide <span class="cnt">${s.words.length}</span></div>
          <div class="vlist">${vocabHTML || '<div style="color:var(--muted);font-size:13px;font-style:italic">— 這頁沒有特別的生字 —</div>'}</div>
        </div>
      </div>`;
    container.appendChild(sec);
  });
  updateStats(totalVocab);
  applyFilters();
}

function updateStats(totalVocab){
  totalVocab = totalVocab || SLIDES.reduce((s,x)=>s+x.words.length, 0);
  const goodSlides = SLIDES.filter(s => STATE.mastery[s.n]==='good').length;
  const weakSlides = SLIDES.filter(s => STATE.mastery[s.n]==='weak').length;
  const starredCnt = Object.keys(STATE.starred).filter(k => STATE.starred[k]).length;
  document.getElementById('stats').innerHTML =
    `<b>${goodSlides}</b>/${SLIDES.length} 熟 · <b style="color:#f66">${weakSlides}</b> 不熟 · <b style="color:#fbbf24">${starredCnt}</b> ⭐`;
}

renderAll();

// ===== Filter logic (combines search + star + weak filters) =====
function applyFilters(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  let visSlides = 0;
  document.querySelectorAll('.slide').forEach(sec => {
    const n = +sec.dataset.slideN;
    const searchMatch = !q || sec.dataset.search.includes(q);
    const weakMatch = !FILTER_WEAK || STATE.mastery[n] === 'weak';
    // Star filter: if on, only show slides that have starred words AND hide non-starred rows
    let starMatch = true;
    if(FILTER_STAR){
      const words = SLIDES.find(s=>s.n===n).words;
      starMatch = words.some(w => STATE.starred[w]);
      // Also hide non-starred vrows
      sec.querySelectorAll('.vrow').forEach(vr => {
        const k = vr.dataset.wordKey;
        vr.classList.toggle('hide-by-star', !STATE.starred[k]);
      });
    } else {
      sec.querySelectorAll('.vrow').forEach(vr => vr.classList.remove('hide-by-star'));
    }
    const show = searchMatch && weakMatch && starMatch;
    sec.classList.toggle('hidden', !show);
    if(show) visSlides++;
  });
  updateStats();
}

// Search input
document.getElementById('q').addEventListener('input', applyFilters);

// Star filter chip
document.getElementById('fltStar').addEventListener('click', e => {
  FILTER_STAR = !FILTER_STAR;
  e.currentTarget.classList.toggle('on', FILTER_STAR);
  applyFilters();
});

// Weak filter chip
document.getElementById('fltWeak').addEventListener('click', e => {
  FILTER_WEAK = !FILTER_WEAK;
  e.currentTarget.classList.toggle('on', FILTER_WEAK);
  applyFilters();
});

// Rate cycle
document.getElementById('rateBtn').addEventListener('click', e=>{
  const rates = [0.7, 0.85, 1.0];
  const idx = (rates.indexOf(RATE) + 1) % rates.length;
  RATE = rates[idx];
  e.target.textContent = RATE + '×';
});

// Toggle vocab column
document.getElementById('modeBtn').addEventListener('click', e=>{
  SCRIPT_ONLY = !SCRIPT_ONLY;
  document.querySelectorAll('.slide-body').forEach(b=>{
    b.style.gridTemplateColumns = SCRIPT_ONLY ? '1fr' : '';
  });
  document.querySelectorAll('.vocab-col').forEach(v=>{
    v.style.display = SCRIPT_ONLY ? 'none' : '';
  });
  e.target.textContent = SCRIPT_ONLY ? '📚 顯示生字' : '📖 只看講稿';
});

// Pronunciation
let currentBtn = null, currentAudio = null;
function stopAll(){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  if(currentBtn){ currentBtn.classList.remove('playing'); currentBtn = null; }
}
function speakGoogle(text, btn){
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + encodeURIComponent(text) + '&tl=en&client=tw-ob';
  const audio = new Audio(url);
  audio.playbackRate = RATE;
  audio.onended = ()=>{ if(btn) btn.classList.remove('playing'); currentAudio = null; currentBtn = null; };
  audio.onerror = ()=>{ if(btn) btn.classList.remove('playing'); currentAudio = null; currentBtn = null; };
  currentAudio = audio;
  audio.play().catch(()=>{ if(btn) btn.classList.remove('playing'); currentAudio = null; currentBtn = null; });
}
function speak(word, btn){
  stopAll();
  if(btn){ btn.classList.add('playing'); currentBtn = btn; }
  if('speechSynthesis' in window && speechSynthesis.getVoices().length > 0){
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = 'en-US';
    utter.rate = RATE;
    const voices = speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en-US') && v.name.includes('Google'))
                 || voices.find(v => v.lang.startsWith('en-US'))
                 || voices.find(v => v.lang.startsWith('en'));
    if(enVoice) utter.voice = enVoice;
    utter.onend = ()=>{ if(btn) btn.classList.remove('playing'); currentBtn = null; };
    utter.onerror = ()=>{ speakGoogle(word, btn); };
    speechSynthesis.speak(utter);
  } else {
    speakGoogle(word, btn);
  }
}

// ===== Click delegator: play / mark highlight / mastery / star =====
document.addEventListener('click', e=>{
  const btn = e.target.closest('.play');
  if(btn){ speak(btn.dataset.word, btn); return; }
  const hl = e.target.closest('mark.hl');
  if(hl){ speak(hl.dataset.word, null); return; }
  // Mastery button
  const mbtn = e.target.closest('.mbtn');
  if(mbtn){
    const n = +mbtn.dataset.slide;
    const lvl = mbtn.dataset.lvl;
    const prev = STATE.mastery[n];
    if(prev === lvl){
      // Toggle off
      delete STATE.mastery[n];
    } else {
      STATE.mastery[n] = lvl;
    }
    saveState();
    // Update UI
    const sec = mbtn.closest('.slide');
    sec.classList.remove('m-weak','m-medium','m-good');
    if(STATE.mastery[n]) sec.classList.add('m-' + STATE.mastery[n]);
    sec.querySelectorAll('.mbtn').forEach(b => {
      b.classList.toggle('on', b.dataset.lvl === STATE.mastery[n]);
    });
    updateStats();
    if(FILTER_WEAK) applyFilters();
    return;
  }
  // Star button
  const star = e.target.closest('.star');
  if(star){
    const word = star.dataset.word;
    const on = !STATE.starred[word];
    if(on) STATE.starred[word] = true;
    else delete STATE.starred[word];
    saveState();
    // Update ALL rows for this word (word may appear on multiple slides)
    document.querySelectorAll(`.vrow[data-word-key="${CSS.escape(word)}"]`).forEach(vr => {
      vr.classList.toggle('starred', on);
      const st = vr.querySelector('.star');
      if(st){ st.classList.toggle('on', on); st.textContent = on ? '★' : '☆'; }
    });
    updateStats();
    if(FILTER_STAR) applyFilters();
    return;
  }
});

// Preload voices
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{};
  speechSynthesis.getVoices();
}
</script>
