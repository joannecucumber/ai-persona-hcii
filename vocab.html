<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCII 生字表 · Vocabulary</title>
<style>
  :root{--bg:#0a0e0b;--card:#141a15;--line:rgba(15,199,123,.22);--accent:#0FC77B;--ink:#f1f3f2;--muted:#aab3ac}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter','PingFang TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5;padding:32px 24px 80px;max-width:960px;margin:0 auto}
  header{border-bottom:1.5px solid var(--line);padding-bottom:18px;margin-bottom:24px}
  h1{color:var(--ink);font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
  h1 .accent{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0 8px}
  #q{flex:1;min-width:200px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:15px;outline:none}
  #q:focus{border-color:var(--accent)}
  .count{color:var(--muted);font-size:13px}
  .btn{background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.on{background:var(--accent);color:#04121a;border-color:var(--accent);font-weight:700}
  section.group{margin-top:32px}
  h2{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .list{display:grid;grid-template-columns:1fr;gap:8px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;transition:.15s}
  .row:hover{border-color:var(--accent)}
  .row.hidden{display:none}
  .w{display:flex;flex-direction:column;gap:4px;min-width:0}
  .w .en{color:var(--ink);font-size:19px;font-weight:700;letter-spacing:-.01em}
  .w .kk{color:var(--accent);font-size:14px;font-family:'Consolas','SF Mono',monospace;letter-spacing:.02em}
  .w .zh{color:var(--muted);font-size:14px}
  .w .zh b{color:#cbd5cc;font-weight:600}
  .play{width:42px;height:42px;border-radius:50%;background:transparent;border:1.5px solid var(--line);color:var(--accent);font-size:16px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .play:hover{background:var(--accent);color:#04121a;border-color:var(--accent)}
  .play.playing{background:var(--accent);color:#04121a;border-color:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:60px;padding-top:20px;border-top:1px solid var(--line)}
  @media (max-width:600px){body{padding:20px 14px 60px}h1{font-size:22px}.w .en{font-size:17px}}
</style>
</head>
<body>
<header>
  <h1>HCII <span class="accent">生字表</span> · Vocabulary</h1>
  <div class="sub">90 個常用學術詞 + 台灣人容易念錯的關鍵字 · 點播放按鈕聽發音</div>
</header>

<div class="toolbar">
  <input id="q" type="text" placeholder="搜尋英文 / 中文 / KK …">
  <button class="btn" id="rateBtn" data-rate="0.85">0.85×</button>
  <span class="count" id="count"></span>
</div>

<div id="content"></div>

<footer>KK 音標 · 中英對照 · 使用 Web Speech API 或 Google TTS 發音 · Deck: <a href="./" style="color:var(--accent)">index</a></footer>

let RATE = 0.85;

function renderAll(){
  const container = document.getElementById('content');
  container.innerHTML = '';
  let total = 0;
  DATA.forEach(g=>{
    const section = document.createElement('section');
    section.className = 'group';
    section.innerHTML = `<h2>${g.group}</h2><div class="list"></div>`;
    const list = section.querySelector('.list');
    g.words.forEach(w=>{
      total++;
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.search = (w.en + ' ' + w.kk + ' ' + w.zh.replace(/<[^>]+>/g,'')).toLowerCase();
      row.innerHTML = `
        <div class="w">
          <div class="en">${w.en}</div>
          <div class="kk">/ ${w.kk} /</div>
          <div class="zh">${w.zh}</div>
        </div>
        <button class="play" title="播放發音" data-word="${w.en}">▶</button>`;
      list.appendChild(row);
    });
    container.appendChild(section);
  });
  document.getElementById('count').textContent = `共 ${total} 字`;
}

renderAll();

// Search filter
document.getElementById('q').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.row').forEach(r=>{
    const match = !q || r.dataset.search.includes(q);
    r.classList.toggle('hidden', !match);
    if(match) visible++;
  });
  // hide empty groups
  document.querySelectorAll('.group').forEach(g=>{
    const has = g.querySelector('.row:not(.hidden)');
    g.style.display = has ? '' : 'none';
  });
  document.getElementById('count').textContent = q ? `搜到 ${visible} 字` : `共 ${visible} 字`;
});

// Rate cycle
document.getElementById('rateBtn').addEventListener('click', e=>{
  const rates = [0.7, 0.85, 1.0];
  const idx = (rates.indexOf(RATE) + 1) % rates.length;
  RATE = rates[idx];
  e.target.textContent = RATE + '×';
});

// Pronunciation: try Web Speech API first, fall back to Google TTS
let currentBtn = null;
let currentAudio = null;
function stopAll(){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  if(currentBtn){ currentBtn.classList.remove('playing'); currentBtn = null; }
}

function speakGoogle(text, btn){
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + encodeURIComponent(text) + '&tl=en&client=tw-ob';
  const audio = new Audio(url);
  audio.playbackRate = RATE;
  audio.onended = ()=>{ btn.classList.remove('playing'); currentAudio = null; currentBtn = null; };
  audio.onerror = ()=>{ btn.classList.remove('playing'); currentAudio = null; currentBtn = null; };
  currentAudio = audio;
  audio.play().catch(err=>{
    btn.classList.remove('playing'); currentAudio = null; currentBtn = null;
  });
}

document.addEventListener('click', e=>{
  const btn = e.target.closest('.play');
  if(!btn) return;
  stopAll();
  const word = btn.dataset.word;
  btn.classList.add('playing');
  currentBtn = btn;
  // try Web Speech API
  if('speechSynthesis' in window && speechSynthesis.getVoices().length > 0){
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = 'en-US';
    utter.rate = RATE;
    const voices = speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en-US') && v.name.includes('Google'))
                 || voices.find(v => v.lang.startsWith('en-US'))
                 || voices.find(v => v.lang.startsWith('en'));
    if(enVoice) utter.voice = enVoice;
    utter.onend = ()=>{ btn.classList.remove('playing'); currentBtn = null; };
    utter.onerror = ()=>{ speakGoogle(word, btn); };
    speechSynthesis.speak(utter);
  } else {
    speakGoogle(word, btn);
  }
});

// Preload voices
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{};
  speechSynthesis.getVoices();
}
</script>
