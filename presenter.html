<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCII · Presenter View 演講模式</title>
<style>
  :root{--bg:#0a0e0b;--card:#141a15;--line:rgba(15,199,123,.22);--accent:#0FC77B;--ink:#f1f3f2;--muted:#aab3ac;--warn:#fbbf24;--danger:#f66}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:'Inter','PingFang TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:16px 20px}

  /* Header bar */
  header{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:20px;padding-bottom:12px;border-bottom:1.5px solid var(--line)}
  h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
  h1 .accent{color:var(--accent)}
  .snum{color:var(--muted);font-size:14px;font-family:'Consolas','SF Mono',monospace}
  .snum b{color:var(--ink);font-weight:800;font-size:20px}
  .clock{font-size:22px;font-weight:800;letter-spacing:.02em;font-family:'Consolas','SF Mono',monospace;color:var(--ink);background:rgba(15,199,123,.1);padding:6px 14px;border-radius:8px;border:1px solid var(--line)}
  .clock.warn{color:var(--warn);border-color:var(--warn)}
  .clock.danger{color:var(--danger);border-color:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .btn{background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;font-weight:600}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#04121a;border-color:var(--accent)}
  .btn.primary:hover{background:#0eb56d;border-color:#0eb56d;color:#04121a}
  .btn.warn{border-color:var(--warn);color:var(--warn)}
  .btn.warn:hover{background:var(--warn);color:#04121a}

  /* Main grid: left = slides, right = script */
  main{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;min-height:0}
  .left{display:grid;grid-template-rows:1fr auto;gap:12px;min-height:0}
  .right{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}

  .preview{background:#000;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
  .preview .plabel{position:absolute;top:8px;left:10px;background:rgba(0,0,0,.6);color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border-radius:4px;z-index:2}
  .preview img{max-width:100%;max-height:100%;display:block;object-fit:contain}
  .preview.big{grid-row:1}
  .preview.small{max-height:180px}
  @media (max-height:700px){.preview.small{max-height:130px}}

  .script-box{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 20px;overflow:auto;min-height:0}
  .script-box .stitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(15,199,123,.12)}
  .script-box .stitle .t{color:var(--ink);font-size:15px;font-weight:800}
  .script-box .stitle .time{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.05em;font-family:'Consolas','SF Mono',monospace}
  .script-box .lbl{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:10px 0 6px}
  .script-box .en{color:var(--ink);font-size:17px;line-height:1.65;font-weight:500}
  .script-box .zh{color:var(--muted);font-size:14px;line-height:1.85;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(15,199,123,.14)}

  .info-strip{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .info-strip b{color:var(--ink)}
  .info-strip .key{background:rgba(15,199,123,.14);color:var(--accent);padding:2px 7px;border-radius:4px;font-weight:800;letter-spacing:.05em}
  .info-strip .sep{color:rgba(255,255,255,.15)}

  /* Footer nav */
  footer{display:flex;gap:10px;align-items:center;padding-top:10px;border-top:1.5px solid var(--line);flex-wrap:wrap}
  footer .spacer{flex:1}
  .status{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  .status .dot{width:8px;height:8px;border-radius:50%;background:#555;transition:.2s}
  .status.on .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}

  @media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.preview.big{max-height:40vh}}
</style>
</head>
<body>
<header>
  <h1>HCII · <span class="accent">Presenter View</span></h1>
  <div class="info-strip">
    <span><span class="key">←</span> <span class="key">→</span> 換頁</span>
    <span class="sep">·</span>
    <span><span class="key">Space</span> 下一頁</span>
    <span class="sep">·</span>
    <span><span class="key">T</span> 計時 開/暫停</span>
    <span class="sep">·</span>
    <span><span class="key">R</span> 重置計時</span>
  </div>
  <div class="clock" id="clock">00:00 / 15:00</div>
  <div class="snum">Slide <b id="cur">1</b> / <span id="tot">18</span></div>
</header>

<main>
  <div class="left">
    <div class="preview big">
      <div class="plabel">Current</div>
      <img id="curImg" src="canva/s1.png" alt="current">
    </div>
    <div class="preview small">
      <div class="plabel">Next</div>
      <img id="nextImg" src="canva/s2.png" alt="next">
    </div>
  </div>

  <div class="right">
    <div class="script-box">
      <div class="stitle">
        <div class="t" id="stitle">Title · 開場</div>
        <div class="time" id="stime">⏱ 0:30</div>
      </div>
      <div class="lbl">🇺🇸 English</div>
      <div class="en" id="sen"></div>
      <div class="lbl">🇹🇼 中文</div>
      <div class="zh" id="szh"></div>
    </div>
  </div>
</main>

<footer>
  <button class="btn" id="prev">◀ Prev</button>
  <button class="btn primary" id="next">Next ▶</button>
  <button class="btn" id="timer">⏱ Start Timer</button>
  <button class="btn" id="resetTimer">🔄 Reset</button>
  <div class="spacer"></div>
  <div class="status" id="audStatus"><span class="dot"></span><span id="audLabel">Audience 未連線</span></div>
  <button class="btn primary" id="openAud">📺 Open Audience Window</button>
</footer>

<script>
// ===== Slide data (title, script, time) =====
const SLIDES = [
  {t:"Title · 開場", time:"0:30",
   en:"Good morning. I'm Chieh-An from National Taiwan University of Science and Technology. Today I'd like to share with you the work I did with Prof. Tang on AI personas.",
   zh:"大家好。我是來自台灣科技大學的簡潔安。今天要跟大家分享我跟唐玄輝教授一起做的 AI 人物誌研究。"},
  {t:"Background · 背景與缺口", time:"1:00",
   en:"With Generative AI, personas have become interactive agents you can actually talk to. Most existing work has asked 'how human-like is the AI?' But how AI personas differ from real participants still remains unclear. We looked at this question from a different angle. We wanted to know what value this difference brings, and how it changes the way we do design research.",
   zh:"有了生成式 AI，人物誌變成可以對話的代理人。過去多數研究都在問「AI 像不像真人」，但 AI 人物誌跟真人之間的差異到底是什麼，目前還不清楚。我們從另一個角度切入，想知道這個差異本身有什麼價值、會如何改變我們做設計研究的方式。"},
  {t:"Research Questions · 研究問題", time:"0:45",
   en:"So we asked two questions. First, how to build an AI persona that stays consistent and is clearly different from other personas? Second, what are the structural differences in language between AI personas and real people?",
   zh:"我們問了兩個問題。第一，怎麼建構一個一致、可區辨的 AI 人物誌？第二，AI 人物誌跟真人在語言表現上有哪些結構性差異？"},
  {t:"Method · Research Process · 研究流程", time:"0:30",
   en:"We built our AI persona using Design Science Research. We treated the AI persona as an artifact: we build it, then we evaluated it across two studies that were designed to answer our two RQs.",
   zh:"我們用設計科學研究方法建構 AI 人物誌。把它當成一個人造物：先建構出來，再用兩個對應我們兩個 RQ 的研究去評估它。"},
  {t:"Method · Context · 研究情境", time:"1:00",
   en:"To test whether a script can keep a persona stable, we needed two opposing personas that live inside the same real-world context. Taiwan's Gen Z ETF market gave us exactly that. It's a fast-growing market with real commercial weight, and inside it we can see two clearly opposing types — one who trusts the crowd, and one who trusts her own rules. That contrast lets us build two personas whose differences are grounded in real behavior, not just in labels.",
   zh:"為了測試劇本能不能撐出一個穩定的 Persona，我們需要在同一個真實情境裡找到兩種對立的角色。台灣 Z 世代 ETF 這個市場剛好符合。這是一個規模夠大、還在快速成長的市場，具有實際的商業份量。而且在這裡我們可以看到兩種鮮明對立的類型——一種相信社群、一種相信自己的紀律。這樣的對比讓我們能建構出行為差異真實存在的兩位角色，而不只是貼標籤。"},
  {t:"Method · Construct · 建構流程", time:"1:00",
   en:"We built the persona in four stages. In the first stage, we used Gemini Deep Research to identify two core axes and four user types, and then build a full profile for each quadrant. Second, to train our personas, we used ChatGPT Deep Research to pull thirty to fifty posts of a first-person voice from Taiwanese online forums. That is where the persona's voice comes from. Third, we wrote a six-dimension script for the personas. Finally, we shipped the script as a GPT with five behavior constraints and role-internalization instructions, so the persona stays in character through long conversations.",
   zh:"我們分四階段建角色。第一階段，建立脈絡：用 Gemini Deep Research 找出兩條核心軸線跟四種用戶類型，再把十字象限四個類型完整刻劃出來。第二階段，語料蒐集：用 ChatGPT Deep Research 從台灣論壇 PTT、Dcard 抓 30 到 50 則第一人稱貼文，角色的聲音來自這裡。第三階段，劇本生成：寫出六維度劇本。第四階段，部署：把劇本上 GPT，加上 5 條行為限制跟角色內化指令，讓角色在長對話中不脫線。"},
  {t:"Six Dimensions · 六維度", time:"1:00",
   en:"For the script, we considered six dimensions. Basic information anchors the identity of the persona, which is a she. Worldview shapes how she sees the market, money, and the future. Psychological state captures what makes her anxious and where her confidence comes from. Behavior covers her daily rituals, like checking the app or chatting with friends. Linguistic style locks in the things that make her sound like herself: slang, particles, tempo. And daily scenarios put her into real situations like commute, payday, or a market crash. Together, these six dimensions hold one stable character across hundreds of turns.",
   zh:"劇本有六個維度。基本資料負責錨定角色身份，這個角色是一位女性。世界觀形塑她怎麼看市場、金錢、未來。心理狀態抓住她在焦慮什麼、信心從哪裡來。行為模式涵蓋她每天的習慣。語言風格鎖住「一聽就知道是她」的東西，俚語、語助詞、節奏。日常情境把她放進真實場景。六個維度一起撐住一個穩定的角色。"},
  {t:"Script Sample · 劇本實例", time:"0:30",
   en:"Here is what the script actually looks like — a live screen recording of the GPT system prompt for each persona. Same six dimensions, written in Traditional Chinese, but the content is intentionally opposite. Let's see how that plays out.",
   zh:"這就是劇本真正的樣子 — 兩位角色各自的 GPT 後台螢幕錄影。同樣的六維度結構、繁體中文撰寫，但內容刻意對立。接下來看看這對立如何呈現。"},
  {t:"Two Personas · Anne & Emily", time:"0:45",
   en:"Same six-dimension script, but we flip one axis, source of confidence, and we get two opposite personas. Take a look at how they answer the same question. Ann's decisions, quote unquote, get pulled along by social platforms. When PTT or her friends are talking about a stock, she follows. Her must-haves are price alerts and trending rankings, because she wants to react fast. On the other hand, Emily, quote unquote, doesn't watch news or YouTube. Her decisions rest on her own principles. Her must-haves are automated recurring investments and rebalancing, because she wants the app to help her stay the course. Same question, completely different answers.",
   zh:"我們建了兩個對立的角色，只翻轉一條軸線——信心來源。小安的決定，引用她原話，「被社群平台帶著走」。她的必備功能是價格警示跟熱門排行。艾蜜莉，引用她原話，「不看新聞跟 YouTube」。她的決定建立在自己的原則上。她的必備功能是定期定額跟再平衡。同樣的問題，完全不同的答案。"},
  {t:"Study 1 · Design · 研究一設計", time:"1:00",
   en:"To answer RQ1, the consistency question, we ran Study 1. We invited six senior designers, each with three or more years of UX research experience. None of them were involved in building the persona, so they could evaluate it objectively. Every session had three parts. First, a stability test: three rounds with each persona using six interview questions, rated on a five-point scale from completely inconsistent to completely consistent. Second, a discriminability test: comparing Anne and Emily head-to-head on each question, rating whether their answers felt identical or very different. Third, separately, the Persona Perception Scale from Salminen and colleagues, which rates six perception constructs for both personas on a one-to-seven Likert scale.",
   zh:"為了回答 RQ1 一致性的問題，我們邀請六位資深設計師。流程分三個部分：第一，穩定性測試 (跟兩位角色各進行三輪對話，1 到 5 分量表)；第二，差異性測試 (比對兩位回答有多相像或多不同)；第三，人物誌感知量表 (Salminen 等 2020，兩位都填，1 到 7 分量表)。"},
  {t:"Study 1 · Results · 研究一結果", time:"1:15",
   en:"Now for the results. Let us first look at the chart on the left, which shows the scores from the stability test and the discriminability test. Both personas held stable — Anne at 4.17 and Emily at 4.47 out of 5. And the two had a clear distinction, shown by 4.58 out of 5. On the right we have the Persona Perception Scale. The first five constructs all had a higher-than-random mean for both personas. This shows that they are indeed useful — Anne's overall is 4.76 and Emily's is 4.86. On the other hand, credibility had the lowest mean for both — Anne 3.67 and Emily 4.17. This reflects that the evaluators could clearly distinguish AI from real people, and were aware of the nature of the tool.",
   zh:"先看左邊 — 穩定性：小安 4.17、艾蜜莉 4.47；差異性 4.58（滿分 5），清楚可辨。右邊感知量表，前五個構面兩位都高於隨機值，整體上小安 4.76、艾蜜莉 4.86。可信度兩位最低 — 小安 3.67、艾蜜莉 4.17，代表評估者能分辨 AI 跟真人，對工具本質保有意識。"},
  {t:"Study 2 · Design · 研究二設計", time:"1:00",
   en:"For RQ2, which is to investigate language differences between AI and humans, we ran a simulation-validation interview online. We interviewed Anne and two screened humans, aged 24 and 26, both matching Anne's Gen Z emotional profile. Each session was 60 minutes. The interview was built around three design concepts, all addressing the same brief: when market volatility triggers panic, how do we stabilize emotional investors so they don't deviate from their plan. For every concept, we asked these same four questions on the middle of the slide. We then coded each response on six linguistic dimensions on the right, each capturing one aspect of how the person talks and thinks, on a 1 to 5 Likert scale. I will walk through the most striking dimensions with examples in the next slide.",
   zh:"我們做了「模擬驗證訪談」，全程線上進行。受訪者是 AI 小安加兩位篩選過的真人 (24、26 歲)。每場 60 分鐘。三個設計方案都在回應同一個設計題目。回應用右邊的六個語言維度編碼，1 到 5 分打分。下一頁我會用例子帶大家看最關鍵的兩個維度。"},
  {t:"Study 2 · Results · 研究二結果", time:"1:30",
   en:"Two dimensions tell the story. C2, Variability: real humans drop hundreds of hesitation markers per interview — fillers, restarts, broken sentences. The AI dropped zero but used emojis, showing that its language was more polished. C6, Tempo: real reflection takes about four minutes to surface; this is because it has to be constructed. The AI gives reflections instantly, at zero delay. Across all six dimensions, AI is plus-43% structural but minus-79% authenticity. The structural fluency actually reveals a lack in authenticity.",
   zh:"C2 變化程度：真人每場冒出幾百個語氣詞跟遲疑，AI 一個都沒有、改用 emoji 補位。太乾淨，反而露餡。C6 思考節奏：真人反思要四分鐘才浮現，AI 問完立刻給答案，零延遲。AI 結構性比真人高 43%、真實性比真人低 79%。"},
  {t:"Findings · Two Modes · 兩種思考", time:"1:10",
   en:"The main takeaway from the two studies above is that AI and humans demonstrate different ways to organize thoughts. The AI shows what we call synthetic thinking. The answer is already there before the question finishes, with zero delay and only three interaction markers. The humans show experiential thinking. The answer forms while they are speaking, with 45 interaction markers, and the real reflection often surfaces only about four minutes later.",
   zh:"這兩個研究最主要的啟示：AI 跟真人展現兩種不同的思考組織方式。AI 是「合成式思考」— 答案在問題還沒講完就成形了，零延遲、只出現三個互動標記。真人是「經歷中的思考」— 邊講邊長出來，45 個互動標記，真正的反思常常要四分鐘後才浮現。"},
  {t:"Discussion · Baseline · 對照基準", time:"1:15",
   en:"So the AI's real value is not in simulating humans but in revealing something that deserves more attention in human interviews. Human interviews bring out what AI cannot: hesitation, contradiction, and emotion. When compared to AI's fluent responses, these interaction markers become meaningful cues instead of noise, inviting us as interviewers to probe deeper (Smith, 2012). AI personas are efficient and always available, so they are perfect for exploring the problem space, finding patterns, and giving designers something solid to compare against in the early stage of research. AI and humans should be complementary, not competing. Different tools serve different jobs: AI for breadth early on, humans for depth later on.",
   zh:"AI 的價值不在模擬真人，而在讓真人訪談中值得關注的東西被看見：遲疑、矛盾、情緒。跟 AI 流暢回應相比，這些互動痕跡變成有意義的線索 (Smith, 2012)。AI 適合前期廣度探索、真人適合後期深度。AI 與真人是互補，不是競爭。"},
  {t:"Living System · 活系統 & 貢獻", time:"1:30",
   en:"To wrap up, this study makes three contributions. Methodologically, we built a validated six-dimension framework for building AI personas. Conceptually, we revealed a distinction between synthetic and experiential thinking, and suggested we look beyond just measuring fidelity. And practically, we showed a clear positioning of how to use AI and humans together: AI for breadth, humans for depth. This points to what we call a living system. The persona evolves, based on real-world data — designer interview records and CRM data from real users.",
   zh:"三個貢獻：方法上，六維度框架；概念上，合成式 vs 經歷中思考的區分；實務上，AI 廣度、真人深度。這指向「活系統」— 人物誌會不斷演化，基於真實世界的資料 (設計師訪談紀錄 + CRM 資料)。"},
  {t:"Conclusion · 結論", time:"0:20",
   en:"From static snapshot to a living system. AI personas do not replace humans. They complement them. And once consistent, they can keep growing with continuous data.",
   zh:"從靜態快照到活系統。AI 人物誌不取代真人，而是與真人互補。一旦一致，就能透過持續的資料成長下去。"},
  {t:"Thank You · 致謝", time:"0:15",
   en:"Thank you. I would love to take your questions.",
   zh:"謝謝聆聽，很歡迎提問。"},
];

const TOT = SLIDES.length;
let idx = 0;
let audWin = null;

const chan = new BroadcastChannel('hcii-deck-sync');
chan.onmessage = (ev) => {
  const d = ev.data;
  if(d.type === 'goto' && typeof d.index === 'number' && d.index !== idx){
    idx = d.index;
    render(false); // don't rebroadcast, avoid loop
  } else if(d.type === 'ping'){
    // Audience is asking for current state
    chan.postMessage({type:'goto', index: idx});
    setAudStatus(true);
  }
};

function setAudStatus(on){
  const el = document.getElementById('audStatus');
  const lbl = document.getElementById('audLabel');
  if(on){ el.classList.add('on'); lbl.textContent = 'Audience 已連線'; }
  else { el.classList.remove('on'); lbl.textContent = 'Audience 未連線'; }
}

function render(broadcast=true){
  idx = Math.max(0, Math.min(TOT-1, idx));
  const s = SLIDES[idx];
  document.getElementById('cur').textContent = idx + 1;
  document.getElementById('tot').textContent = TOT;
  document.getElementById('curImg').src = 'canva/s' + (idx+1) + '.png';
  const nextI = Math.min(idx+1, TOT-1);
  document.getElementById('nextImg').src = 'canva/s' + (nextI+1) + '.png';
  document.getElementById('stitle').textContent = s.t;
  document.getElementById('stime').textContent = '⏱ ' + s.time;
  document.getElementById('sen').textContent = s.en || '';
  document.getElementById('szh').textContent = s.zh || '';
  document.querySelector('.script-box').scrollTop = 0;
  if(broadcast) chan.postMessage({type:'goto', index: idx});
}

function go(n){ idx = n; render(); }
function next(){ if(idx < TOT-1){ idx++; render(); } }
function prev(){ if(idx > 0){ idx--; render(); } }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if(e.key === 'ArrowLeft') { prev(); }
  else if(e.key === 't' || e.key === 'T') { toggleTimer(); }
  else if(e.key === 'r' || e.key === 'R') { resetTimer(); }
});

// ===== Timer =====
let timerStart = null, timerElapsed = 0, timerRunning = false, timerInt = null;
function fmt(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function tick(){
  const now = Math.floor((Date.now() - timerStart) / 1000) + timerElapsed;
  const clockEl = document.getElementById('clock');
  clockEl.textContent = fmt(now) + ' / 15:00';
  clockEl.classList.toggle('warn', now >= 13*60 && now < 15*60);
  clockEl.classList.toggle('danger', now >= 15*60);
}
function toggleTimer(){
  const btn = document.getElementById('timer');
  if(timerRunning){
    timerElapsed += Math.floor((Date.now() - timerStart) / 1000);
    clearInterval(timerInt);
    timerRunning = false;
    btn.textContent = '▶ Resume Timer';
  } else {
    timerStart = Date.now();
    timerInt = setInterval(tick, 500);
    timerRunning = true;
    btn.textContent = '⏸ Pause Timer';
    tick();
  }
}
function resetTimer(){
  clearInterval(timerInt);
  timerRunning = false;
  timerStart = null;
  timerElapsed = 0;
  document.getElementById('clock').textContent = '00:00 / 15:00';
  document.getElementById('clock').classList.remove('warn','danger');
  document.getElementById('timer').textContent = '⏱ Start Timer';
}
document.getElementById('timer').onclick = toggleTimer;
document.getElementById('resetTimer').onclick = resetTimer;

// ===== Open Audience Window =====
document.getElementById('openAud').onclick = () => {
  // width/height ~= 16:9 aspect
  const w = Math.min(1600, screen.width);
  const h = Math.floor(w * 9 / 16);
  audWin = window.open('index.html?mode=audience', 'hcii-audience', 'width='+w+',height='+h+',left=0,top=0');
  setTimeout(() => chan.postMessage({type:'goto', index: idx}), 500);
  // Auto detect close
  const checkClosed = setInterval(() => {
    if(audWin && audWin.closed){
      setAudStatus(false);
      clearInterval(checkClosed);
    }
  }, 1500);
};

// Initial render
render();
