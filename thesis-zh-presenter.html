<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenter · 中文簡報 · AI Persona 論文口試</title>
<style>
  :root{
    --bg:#0a0e0b;--card:#141a15;--line:rgba(15,199,123,.22);--accent:#0FC77B;
    --ink:#f1f3f2;--muted:#aab3ac;--warn:#fbbf24
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Inter',-apple-system,sans-serif;overflow:hidden}
  .app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr auto;height:100vh;gap:0}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1.6px solid var(--line);background:rgba(15,199,123,.04)}
  header .l{display:flex;align-items:center;gap:14px}
  header .badge{background:var(--accent);color:#04121a;font-weight:800;font-size:12px;letter-spacing:.14em;padding:5px 10px;border-radius:5px}
  header .no{font-family:'Consolas','SF Mono',monospace;color:var(--muted);font-size:13px}
  header .no b{color:var(--ink)}
  header .r{display:flex;align-items:center;gap:20px}
  header .conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  header .conn::before{content:'';width:8px;height:8px;background:var(--muted);border-radius:50%}
  header .conn.on{color:var(--accent)}
  header .conn.on::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  header .timer{font-family:'Consolas','SF Mono',monospace;font-size:16px;color:var(--ink);font-weight:600}
  header .timer.warn{color:var(--warn)}
  header button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer;border-radius:6px;transition:.2s}
  header button:hover{background:var(--accent);color:#04121a;border-color:var(--accent)}
  main{padding:24px 32px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
  .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .title-row h1{font-size:26px;font-weight:800;line-height:1.3;color:var(--ink)}
  .title-row .sec{font-family:'Consolas','SF Mono',monospace;font-size:14px;color:var(--accent);font-weight:700}
  .script{font-size:22px;line-height:2.05;color:var(--ink);letter-spacing:.02em}
  .script p{margin-bottom:14px}
  .script b{color:var(--accent);font-weight:600}
  .cue{background:rgba(251,191,36,.1);border-left:4px solid var(--warn);padding:12px 18px;border-radius:0 8px 8px 0;color:var(--warn);font-size:15px;line-height:1.6;margin-top:12px}
  .cue b{color:var(--warn);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;display:block;margin-bottom:4px}
  aside{background:var(--card);border-left:1.6px solid var(--line);padding:20px 20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
  aside .lbl{color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
  .next-card{background:var(--bg);border:1.6px solid var(--line);border-radius:10px;padding:14px 16px}
  .next-card .no{font-family:'Consolas','SF Mono',monospace;color:var(--accent);font-size:11px;font-weight:700;margin-bottom:4px}
  .next-card h3{font-size:15px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:6px}
  .next-card p{font-size:12px;color:var(--muted);line-height:1.55}
  .progress{background:var(--bg);border-radius:8px;padding:12px 14px;border:1.6px solid var(--line)}
  .progress .row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
  .progress .row b{color:var(--ink);font-family:'Consolas','SF Mono',monospace}
  .bar{width:100%;height:5px;background:rgba(15,199,123,.15);border-radius:3px;overflow:hidden}
  .bar-inner{height:100%;background:var(--accent);transition:width .3s;width:0}
  .toc{background:var(--bg);border:1.6px solid var(--line);border-radius:10px;padding:10px;max-height:200px;overflow-y:auto}
  .toc-item{display:flex;justify-content:space-between;padding:4px 8px;border-radius:4px;font-size:12px;cursor:pointer;color:var(--muted);transition:.15s;line-height:1.4}
  .toc-item:hover{background:rgba(15,199,123,.08);color:var(--ink)}
  .toc-item.active{background:var(--accent);color:#04121a;font-weight:700}
  .toc-item .no{font-family:'Consolas','SF Mono',monospace;margin-right:6px}
  footer{grid-column:1/-1;padding:12px 24px;border-top:1.6px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);background:rgba(15,199,123,.03)}
  footer .k{font-family:'Consolas','SF Mono',monospace}
  footer b{color:var(--ink)}
  footer .nav{display:flex;gap:8px}
  footer .nav button{background:var(--card);border:1px solid var(--line);color:var(--ink);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:.2s}
  footer .nav button:hover{background:var(--accent);color:#04121a;border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="l">
      <span class="badge">PRESENTER</span>
      <span class="no">S<b id="cur-no">1</b> / 20</span>
      <span class="conn" id="conn">未連線</span>
    </div>
    <div class="r">
      <span class="timer" id="timer">00:00</span>
      <button id="btn-timer">開始</button>
      <button id="btn-reset">重置</button>
      <button id="btn-open">開簡報視窗</button>
    </div>
  </header>
  <main>
    <div class="title-row">
      <h1 id="title"></h1>
      <div class="sec">建議 <span id="sec">30</span> 秒</div>
    </div>
    <div class="script" id="script"></div>
    <div id="cue-wrap"></div>
  </main>
  <aside>
    <div>
      <div class="lbl">下一頁</div>
      <div class="next-card" id="next-card">
        <div class="no">S2</div>
        <h3>下一頁標題</h3>
        <p>下一段講稿摘要...</p>
      </div>
    </div>
    <div>
      <div class="lbl">整體進度</div>
      <div class="progress">
        <div class="row"><span>已講</span><b id="elapsed">00:00</b></div>
        <div class="row"><span>目標</span><b>20:00</b></div>
        <div class="bar"><div class="bar-inner" id="bar-inner"></div></div>
      </div>
    </div>
    <div>
      <div class="lbl">跳頁</div>
      <div class="toc" id="toc"></div>
    </div>
  </aside>
  <footer>
    <div>← → 換頁 · <b>Space</b> 開始/暫停計時 · <b>R</b> 重置 · <b>F</b> 全螢幕</div>
    <div class="nav">
      <button id="prev">‹</button>
      <button id="next">›</button>
    </div>
  </footer>
</div>

<script src="thesis-zh-scripts.js"></script>
<script>
  const S=window.THESIS_ZH_SCRIPTS||[];
  const tot=S.length;
  let i=0;
  const bc=new BroadcastChannel('thesis-zh-deck');

  // Timer
  let sec=0,running=false,tid=null;
  function fmt(n){const m=Math.floor(n/60),s=n%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
  function tickTimer(){
    if(!running)return;
    sec++;
    document.getElementById('timer').textContent=fmt(sec);
    document.getElementById('elapsed').textContent=fmt(sec);
    const pct=Math.min(100,(sec/1200)*100);
    document.getElementById('bar-inner').style.width=pct+'%';
    document.getElementById('timer').classList.toggle('warn',sec>1200);
  }
  document.getElementById('btn-timer').onclick=()=>{
    running=!running;
    document.getElementById('btn-timer').textContent=running?'暫停':'繼續';
  };
  document.getElementById('btn-reset').onclick=()=>{
    sec=0;running=false;
    document.getElementById('timer').textContent='00:00';
    document.getElementById('elapsed').textContent='00:00';
    document.getElementById('bar-inner').style.width='0%';
    document.getElementById('btn-timer').textContent='開始';
    document.getElementById('timer').classList.remove('warn');
  };
  setInterval(tickTimer,1000);

  // Format bold **text** and \n line breaks
  function format(str){
    return str.split('\n\n').map(p=>
      '<p>'+p.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>'
    ).join('');
  }

  // Render TOC
  const toc=document.getElementById('toc');
  S.forEach((s,k)=>{
    const el=document.createElement('div');
    el.className='toc-item';el.dataset.i=k;
    el.innerHTML=`<span><span class="no">S${s.no}</span>${s.title}</span><span class="no">${s.sec}″</span>`;
    el.onclick=()=>show(k,true);
    toc.appendChild(el);
  });

  function show(n,broadcast){
    i=Math.max(0,Math.min(tot-1,n));
    const s=S[i];
    document.getElementById('cur-no').textContent=s.no;
    document.getElementById('title').textContent=s.title;
    document.getElementById('sec').textContent=s.sec;
    document.getElementById('script').innerHTML=format(s.body);
    const cue=document.getElementById('cue-wrap');
    if(s.cue){cue.innerHTML=`<div class="cue"><b>控場</b>${s.cue}</div>`}else{cue.innerHTML=''}
    // next card
    const nxt=S[i+1];
    const nc=document.getElementById('next-card');
    if(nxt){
      nc.innerHTML=`<div class="no">S${nxt.no} · ${nxt.sec}″</div><h3>${nxt.title}</h3><p>${nxt.body.replace(/\*\*(.+?)\*\*/g,'$1').split('\n\n')[0].slice(0,80)}...</p>`;
    }else{
      nc.innerHTML=`<div class="no">END</div><h3>簡報結束</h3><p>準備進 Q&A</p>`;
    }
    // toc active
    [...toc.children].forEach((el,k)=>el.classList.toggle('active',k===i));
    // sync to audience
    if(broadcast!==false)bc.postMessage({type:'goto',i});
  }
  function next(){show(i+1,true)} function prev(){show(i-1,true)}
  document.getElementById('next').onclick=next;
  document.getElementById('prev').onclick=prev;

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev()}
    else if(e.key===' '){e.preventDefault();document.getElementById('btn-timer').click()}
    else if(e.key.toLowerCase()==='r'){document.getElementById('btn-reset').click()}
    else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}
  });

  // Listen for audience-driven navigation (rare, but possible)
  bc.onmessage=e=>{
    if(e.data.type==='goto'&&e.data.i!==i)show(e.data.i,false);
    else if(e.data.type==='hello'){bc.postMessage({type:'goto',i});setConn(true)}
    else if(e.data.type==='pong')setConn(true);
  };
  function setConn(on){
    const c=document.getElementById('conn');
    c.classList.toggle('on',on);
    c.textContent=on?'簡報已連線':'未連線';
  }
  // Ping audience
  bc.postMessage({type:'ping'});
  setTimeout(()=>bc.postMessage({type:'ping'}),500);

  document.getElementById('btn-open').onclick=()=>{
    window.open('thesis-zh.html','audience','width=1280,height=800');
  };

  show(0,true);
</script>
</body>
</html>
